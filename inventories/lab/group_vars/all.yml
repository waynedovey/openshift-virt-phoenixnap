---
project_name: phoenixnap-ocp422-evpn
base_domain: digitaldovey.net
ocp_minor: "4.22"

rhacm:
  existing_hub: true
  api: "https://api.acm.sandbox5165.opentlc.com:6443"
  kubeconfig: "{{ lookup('env', 'RHACM_KUBECONFIG') }}"
  # Existing AgentClusterInstall imageSetRef values are authoritative on reruns.
  # Fresh installs discover/self-heal a 4.22 ClusterImageSet; set
  # OPENSHIFT_CLUSTER_IMAGE_SET to force a known existing image-set name, or
  # OPENSHIFT_RELEASE_IMAGE to change the payload used for auto-creation.
  auto_create_clusterimageset: true
  release_image: >-
    {{ lookup('env', 'OPENSHIFT_RELEASE_IMAGE')
       | default('quay.io/openshift-release-dev/ocp-release:' ~ ocp_minor ~ '.0-x86_64', true) }}
  # iPXE firmware often has limited HTTPS cipher support. This patches the
  # hub-wide AgentServiceConfig to expose iPXE artifacts over HTTP.
  enable_http_ipxe_route: true
  infraenv_ipxe_script_type: BootOrderControl
  # The OpenTLC ingress path truncates the ~1.2 GiB Assisted Image Service
  # rootfs stream. Append the authoritative AgentServiceConfig rootFSUrl as
  # a later kernel argument so dracut fetches the large image directly.
  direct_rootfs:
    enabled: true
  # Explicit NTP sources for discovery. DHCP/NTP is unreliable on the raw
  # dual-NIC iPXE network until the phoenixNAP bond is established.
  additional_ntp_sources:
    - time.google.com
    - time.cloudflare.com

phoenixnap:
  api_base: "https://api.phoenixnap.com"
  auth_url: "https://auth.phoenixnap.com/auth/realms/BMC/protocol/openid-connect/token"
  # Static fallback only. With auto_select.enabled=true, the selector chooses
  # a live in-stock SKU per site under the hourly budget before provisioning.
  server_type: auto
  pricing_model: HOURLY
  auto_select:
    enabled: true
    # Strictly less than this amount per server, per hour. Pricing is read live
    # from the phoenixNAP Billing /products endpoint at execution time.
    max_hourly_price: 0.30
    # Hard minimum for this OpenShift Virtualization lab.
    min_ram_gb: 64
    min_cores: 6
    # LVMS needs a dedicated empty disk in addition to the OpenShift install disk.
    # The selector parses phoenixNAP's storage description and rejects one-disk SKUs.
    min_storage_devices: 2
    # Prefer a shape around this size, then choose the cheapest qualifying SKU.
    preferred_ram_gb: 128
    preferred_cores: 8
    # Same SKU in the two configured iPXE-capable locations is preferred for a clean two-site comparison.
    # If none exists, select the best valid SKU independently at each site.
    prefer_common_sku: true
    require_common_sku: false
    show_top_candidates: 8
  # Public management/iPXE plus an explicit site-local private L2 VLAN.
  # The private network list itself is USER_DEFINED in networkConfiguration.
  network_type: PUBLIC_AND_PRIVATE
  install_default_ssh_keys: false
  # phoenixNAP iPXE presents two physical data NICs. During the first discovery
  # both can obtain the same native-VLAN DHCP address, which Assisted Installer
  # rejects as overlapping. Build the provider-recommended LACP bond from the
  # discovered MAC addresses, clone the active NIC MAC for DHCP, then reboot iPXE.
  ipxe_network:
    # phoenixNAP currently permits native os=ipxe provisioning only in these locations.
    # Keep this explicit so `make availability`, `make preflight`, and `make deploy` fail fast
    # instead of selecting a valid SERVER SKU in a location where the iPXE OS is unavailable.
    # Override this list only after the provider confirms additional native-iPXE locations.
    supported_locations:
      - PHX
      - ASH
      - NLD
    configure_lacp_bond: true
    bond_name: bond0
    bond_mode: 802.3ad
    mtu: 1500
    miimon: 100
    lacp_rate: fast
    xmit_hash_policy: layer3+4
    updelay: 200
    downdelay: 200
    # The Agent CR can exist several seconds before Assisted Installer publishes
    # the JSON discovery inventory annotation used to choose the LACP NICs.
    inventory_wait_seconds: 5
    inventory_wait_retries: 60
  delete_ip_blocks_on_destroy: true
  delete_private_networks_on_destroy: false
  # Destroy is intentionally idempotent. phoenixNAP returns HTTP 409 while a
  # server is already deleting or another asynchronous lifecycle operation is
  # still settling. Retry conflicts and wait for the server to disappear before
  # removing dependent lab resources.
  destroy_poll_seconds: 10
  destroy_deprovision_conflict_retries: 24
  destroy_server_delete_retries: 60
  # Server type cannot be resized in place. Existing mismatched servers are
  # never silently destroyed; use `make replace-servers` explicitly.
  fail_on_existing_server_mismatch: true
  # Existing installed SNOs are never replaced just because a day-2 private
  # network attachment is rejected. Reconciliation is attempted, but make
  # deploy continues into the OpenShift/EVPN stages by default. Set the fail
  # flag to true for strict greenfield CI behavior.
  reconcile_existing_private_networks: true
  fail_on_existing_private_network_reconcile_error: false
  bgp:
    # phoenixNAP BGP Peer Groups are ordinary IPv4 BGP. Live testing showed
    # that AS65400 does not negotiate the L2VPN EVPN AFI/SAFI, so these are
    # optional and are not part of the OpenShift EVPN fabric.
    enabled: "{{ lookup('env', 'PNAP_BGP_ENABLED') | default('false', true) | bool }}"
    asn: 65401
    advertised_routes: NONE

ssh_public_key:
  path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

openshift_pull_secret_file: >-
  {{ lookup('env', 'OPENSHIFT_PULL_SECRET_FILE') }}

sites:
  sw1:
    cluster_name: sw1
    # Set a concrete SKU only when auto_select.enabled=false.
    server_type: auto
    location: PHX
    node_hostname: sno-sw1.digitaldovey.net
    cluster_network: 10.128.0.0/14
    host_prefix: 23
    service_network: 172.30.0.0/16
    bgp_asn: 65011
    # Legacy/external-provider dummy VTEP. fabric-router mode derives the public IP instead.
    vtep_ip: 10.255.50.11
    private_l2:
      name: ocp-sw1-vm-l2
      # Guest VM addressing only. phoenixNAP VLAN itself is created NO-CIDR.
      cidr: 10.60.10.0/24
      # Private VLAN is trunked over the phoenixNAP dual-NIC LACP bond.
      uplink_interface: bond0
  c1:
    cluster_name: c1
    server_type: auto
    # CHI cannot currently provision phoenixNAP native `os: ipxe`; use ASH for the
    # second default site while keeping the logical cluster name/API/DNS as c1.
    location: ASH
    node_hostname: sno-c1.digitaldovey.net
    cluster_network: 10.132.0.0/14
    host_prefix: 23
    service_network: 172.31.0.0/16
    bgp_asn: 65021
    # Legacy/external-provider dummy VTEP. fabric-router mode derives the public IP instead.
    vtep_ip: 10.255.50.21
    private_l2:
      name: ocp-c1-vm-l2
      # Guest VM addressing only. phoenixNAP VLAN itself is created NO-CIDR.
      cidr: 10.60.20.0/24
      uplink_interface: bond0

cloudflare:
  enabled: true
  zone: digitaldovey.net
  proxied: false
  ttl: 1

dns_record_prefixes:
  - api
  - api-int
  - "*.apps"

# Red Hat LVM Storage for both SNO clusters.
#
# This lab requires phoenixNAP SNO shapes with at least two physical storage devices.
# Assisted Installer owns the complete installation disk, so the safe/supported
# day-2 layout is:
#   NVMe 0 -> RHCOS/OpenShift
#   NVMe 1 -> LVMS vg1 / thin-pool-1
#
# The storage role discovers exactly one completely-unused non-install disk and
# pins its stable /dev/disk/by-path path into the LVMCluster. It never wipes the
# RHCOS installation disk.
lvm_storage:
  enabled: true
  namespace: openshift-lvm-storage
  subscription: lvms-operator
  channel: stable-4.22
  package: lvms-operator
  source: redhat-operators
  source_namespace: openshift-marketplace
  lvmcluster_name: lvmcluster
  device_class: vg1
  thin_pool_name: thin-pool-1
  # 90 is the maximum supported LVMS thin-pool percentage in OCP 4.22.
  size_percent: 90
  overprovision_ratio: 1
  # Require enough raw capacity that the resulting 90% thin pool is >= 600 GiB.
  # A qualifying two-disk phoenixNAP shape normally provides a ~1 TB dedicated secondary NVMe.
  min_thin_pool_gib: 600
  force_wipe: false
  make_default: true
  make_default_virt: true

virtualization:
  enabled: true
  namespace: openshift-cnv
  subscription: kubevirt-hyperconverged
  channel: stable
  source: redhat-operators
  source_namespace: openshift-marketplace

nmstate:
  enabled: true
  namespace: openshift-nmstate
  subscription: kubernetes-nmstate-operator
  channel: stable
  source: redhat-operators
  source_namespace: openshift-marketplace

# Site-local physical/L2 VM access. phoenixNAP assigns a private VLAN in each
# region. The SNO exposes that VLAN through an OVN-Kubernetes Localnet CUDN.
# These two VLANs are NOT a cross-region L2 stretch.
vm_l2:
  enabled: true
  apply: true
  namespace: vm-workloads
  network_name: pnap-vm-localnet
  physical_network_name: pnap-vm-l2
  bridge_name: br-pnap-vm
  namespace_label_key: digitaldovey.net/vm-l2
  namespace_label_value: "true"
  # The tagged private VLAN intentionally rides the same LACP bond as the
  # native/public management VLAN; it is isolated by 802.1Q tagging.
  require_non_management_interface: false

# OpenShift EVPN platform enablement is part of `make deploy`.
#
# The default fabric mode is now an external eBGP EVPN fabric router. Live
# testing proved two important constraints in this lab:
#   * phoenixNAP BGP Peer Groups establish IPv4 BGP but do not negotiate
#     L2VPN EVPN.
#   * OpenShift FRR-K8s starts bgpd with -p 0, so two FRR-K8s speakers cannot
#     be used as each other's passive TCP/179 fabric peer.
#
# A small FRR fabric router solves the control-plane problem while the actual
# OpenShift VXLAN data plane stays direct between the two SNO public IPs on
# UDP/4789. It is intentionally a normal eBGP transit router, not a transparent
# transparent route-server semantics: AS65000 is prepended, while the EVPN next-hop is preserved.
evpn:
  enabled: true
  platform_apply: true
  fabric_required: true
  fabric_mode: "{{ lookup('env', 'EVPN_FABRIC_MODE') | default('fabric-router', true) }}"

  namespace: evpn-vms
  network_name: evpn-vm-net
  vm_subnet: 10.50.50.0/24
  vm_mtu: 1400

  # OpenShift EVPN data plane. In fabric-router mode the existing public
  # br-ex IPv4 address on each SNO is used as the unmanaged VTEP, with an
  # exact /32 VTEP CIDR. Red Hat documents the dummy-interface pattern as a
  # recommendation for redundant fabric peering, not a requirement.
  vni: 5050
  route_target: "65000:5050"
  legacy_vtep_cidr: 10.255.50.0/24

  # Default lab fabric. The fabric router carries only MP-BGP EVPN
  # control-plane traffic. VXLAN VNI 5050 / UDP 4789 remains direct PHX<->ASH.
  fabric_router:
    auto_provision: "{{ lookup('env', 'EVPN_FR_AUTO_PROVISION') | default('false', true) | bool }}"
    address: "{{ lookup('env', 'EVPN_FR_ADDRESS') | default('', true) }}"
    asn: "{{ lookup('env', 'EVPN_FR_ASN') | default('65000', true) | int }}"
    router_id: "{{ lookup('env', 'EVPN_FR_ROUTER_ID') | default('10.255.255.1', true) }}"
    hostname: "{{ lookup('env', 'EVPN_FR_HOSTNAME') | default('evpn-fr.' ~ base_domain, true) }}"
    location: "{{ lookup('env', 'EVPN_FR_LOCATION') | default('PHX', true) }}"
    os: "{{ lookup('env', 'EVPN_FR_OS') | default('ubuntu/jammy', true) }}"
    password: "{{ lookup('env', 'EVPN_FR_BGP_PASSWORD') | default('', true) }}"
    auto_select:
      max_hourly_price: "{{ lookup('env', 'EVPN_FR_MAX_HOURLY_PRICE') | default('0.30', true) | float }}"
      min_ram_gb: 8
      min_cores: 2
      preferred_ram_gb: 16
      preferred_cores: 2
      show_top_candidates: 5

  bgp_auth:
    enabled: "{{ lookup('env', 'EVPN_BGP_AUTH_ENABLED') | default('true', true) | bool }}"
    secret_name: evpn-bgp-auth

  # A real external/DC EVPN fabric remains supported. In this mode the
  # original dummy VTEPs are retained because the provider fabric is expected
  # to route the private VTEP CIDR.
  fabric_confirmed: "{{ lookup('env', 'EVPN_FABRIC_CONFIRMED') | default('false', true) | bool }}"
  peer_asn: "{{ lookup('env', 'EVPN_PEER_ASN') | default('65000', true) | int }}"
  peers:
    sw1: "{{ lookup('env', 'EVPN_SW1_PEER') | default('', true) }}"
    c1: "{{ lookup('env', 'EVPN_C1_PEER') | default('', true) }}"

  # Retained only as an explicit legacy diagnostic mode. It is no longer the
  # default because the live PHX<->ASH UDP/4790 carrier did not pass traffic.
  transport:
    interface: evpn-transit0
    vni: 4090
    udp_port: "{{ lookup('env', 'EVPN_TRANSIT_UDP_PORT') | default('4790', true) | int }}"
    mtu: 1450
    prefix_length: 30
    addresses:
      sw1: 192.168.254.1
      c1: 192.168.254.2

  # Each cluster has its own OVN IPAM database. Keep one shared /24 and split
  # automatic allocations/gateway infrastructure by site to prevent duplicate
  # addresses while preserving one Layer-2 EVPN segment.
  addressing:
    sw1:
      default_gateway: 10.50.50.1
      infrastructure_subnet: 10.50.50.0/28
      reserved_subnets:
        - 10.50.50.128/25
    c1:
      default_gateway: 10.50.50.129
      infrastructure_subnet: 10.50.50.128/28
      reserved_subnets:
        - 10.50.50.0/25

wait:
  server_seconds: 1800
  network_seconds: 900
  install_seconds: 7200
  operator_seconds: 1800
