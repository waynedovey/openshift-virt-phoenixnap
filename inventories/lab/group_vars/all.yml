---
project_name: phoenixnap-ocp422-evpn
base_domain: digitaldovey.net
ocp_minor: "4.22"

rhacm:
  existing_hub: true
  api: "https://api.acm.sandbox5165.opentlc.com:6443"
  kubeconfig: "{{ lookup('env', 'RHACM_KUBECONFIG') }}"
  # iPXE firmware often has limited HTTPS cipher support. This patches the
  # hub-wide AgentServiceConfig to expose iPXE artifacts over HTTP.
  enable_http_ipxe_route: true
  infraenv_ipxe_script_type: BootOrderControl

phoenixnap:
  api_base: "https://api.phoenixnap.com"
  auth_url: "https://auth.phoenixnap.com/auth/realms/BMC/protocol/openid-connect/token"
  # Default server type. Each site can override this independently.
  server_type: s1.c1.medium
  pricing_model: HOURLY
  # Public management/iPXE plus an explicit site-local private L2 VLAN.
  # The private network list itself is USER_DEFINED in networkConfiguration.
  network_type: PUBLIC_AND_PRIVATE
  install_default_ssh_keys: false
  delete_ip_blocks_on_destroy: true
  delete_private_networks_on_destroy: false
  # Server type cannot be resized in place. Existing mismatched servers are
  # never silently destroyed; use `make replace-servers` explicitly.
  fail_on_existing_server_mismatch: true
  bgp:
    enabled: true
    asn: 65401
    advertised_routes: NONE

ssh_public_key:
  path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

openshift_pull_secret_file: >-
  {{ lookup('env', 'OPENSHIFT_PULL_SECRET_FILE') }}

sites:
  sw1:
    cluster_name: sw1
    # Override per site when a SKU is temporarily unavailable in a location.
    server_type: s1.c1.medium
    location: PHX
    node_hostname: sno-sw1.digitaldovey.net
    cluster_network: 10.128.0.0/14
    host_prefix: 23
    service_network: 172.30.0.0/16
    bgp_asn: 65011
    vtep_ip: 10.255.50.11
    private_l2:
      name: ocp-sw1-vm-l2
      cidr: 10.60.10.0/24
      server_ip: 10.60.10.10
      # auto = choose an UP Ethernet NIC that is not carrying the default route.
      # Set explicitly if your SNO interface naming differs.
      uplink_interface: auto
  c1:
    cluster_name: c1
    server_type: s1.c1.medium
    location: CHI
    node_hostname: sno-c1.digitaldovey.net
    cluster_network: 10.132.0.0/14
    host_prefix: 23
    service_network: 172.31.0.0/16
    bgp_asn: 65021
    vtep_ip: 10.255.50.21
    private_l2:
      name: ocp-c1-vm-l2
      cidr: 10.60.20.0/24
      server_ip: 10.60.20.10
      uplink_interface: auto

cloudflare:
  enabled: true
  zone: digitaldovey.net
  proxied: false
  ttl: 1

dns_record_prefixes:
  - api
  - api-int
  - "*.apps"

virtualization:
  enabled: true
  namespace: openshift-cnv
  subscription: kubevirt-hyperconverged
  channel: stable
  source: redhat-operators
  source_namespace: openshift-marketplace

nmstate:
  enabled: true
  namespace: openshift-nmstate
  subscription: kubernetes-nmstate-operator
  channel: stable
  source: redhat-operators
  source_namespace: openshift-marketplace

# Site-local physical/L2 VM access. phoenixNAP assigns a private VLAN in each
# region. The SNO exposes that VLAN through an OVN-Kubernetes Localnet CUDN.
# These two VLANs are NOT a cross-region L2 stretch.
vm_l2:
  enabled: true
  apply: true
  namespace: vm-workloads
  network_name: pnap-vm-localnet
  physical_network_name: pnap-vm-l2
  bridge_name: br-pnap-vm
  namespace_label_key: digitaldovey.net/vm-l2
  namespace_label_value: "true"
  require_non_management_interface: true

# IMPORTANT: phoenixNAP BGP peer groups are ordinary IP BGP. They are not
# treated here as an EVPN fabric. EVPN application is gated until the actual
# external EVPN peer addresses are known and reachable from both SNO nodes.
evpn:
  enabled: true
  apply: false
  fabric_confirmed: false
  namespace: evpn-vms
  network_name: evpn-vm-net
  vm_subnet: 10.50.50.0/24
  vtep_cidr: 10.255.50.0/24
  vni: 5050
  route_target: "65000:5050"
  peer_asn: 65000
  peers:
    sw1: ""
    c1: ""

wait:
  server_seconds: 1800
  network_seconds: 900
  install_seconds: 7200
  operator_seconds: 1800
