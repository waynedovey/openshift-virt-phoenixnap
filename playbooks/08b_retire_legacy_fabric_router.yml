---
- name: Retire repository-owned legacy phoenixNAP EVPN fabric router
  hosts: localhost
  gather_facts: false
  roles:
    - role: pnap_auth
      when:
        - evpn.enabled | bool
        - evpn.fabric_mode == 'embedded-router'
        - evpn.embedded_router.retire_legacy_server | bool
    - role: retire_evpn_fabric_router
      when:
        - evpn.enabled | bool
        - evpn.fabric_mode == 'embedded-router'
