---
- name: Preflight external services and capacity
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Require native-iPXE-capable phoenixNAP locations
      ansible.builtin.assert:
        that:
          - sites.sw1.location in phoenixnap.ipxe_network.supported_locations
          - sites.c1.location in phoenixnap.ipxe_network.supported_locations
          - sites.sw1.location != sites.c1.location
        fail_msg: >-
          This lab provisions servers with phoenixNAP native `os: ipxe`.
          Configured locations are SW1={{ sites.sw1.location }}, C1={{ sites.c1.location }}, but the
          provider-supported native-iPXE list in this repo is
          {{ phoenixnap.ipxe_network.supported_locations | join(', ') }}.
          CHI currently rejects `os: ipxe`; use ASH (default) or NLD for C1, or implement
          a separate RAM-OS/kexec bootstrap path before using CHI.
  roles:
    - role: pnap_auth
    # Always inventory existing servers first. In auto-select mode the role only
    # asks Billing for live stock for sites that do not already have a server.
    - role: pnap_select_sku
  tasks:
    - name: Require secret environment variables and files
      ansible.builtin.assert:
        that:
          - lookup('env', 'PNAP_CLIENT_ID') | length > 0
          - lookup('env', 'PNAP_CLIENT_SECRET') | length > 0
          - lookup('env', 'CLOUDFLARE_API_TOKEN') | length > 0
          - rhacm.kubeconfig | length > 0
          - openshift_pull_secret_file | length > 0
        fail_msg: "Source .env (copied from .env.example) and provide the required paths/secrets."

    - name: Check local credential files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ rhacm.kubeconfig }}"
        - "{{ openshift_pull_secret_file }}"
        - "{{ ssh_public_key.path }}"
      register: credential_files

    - name: Require local credential files to exist
      ansible.builtin.assert:
        that:
          - credential_files.results | map(attribute='stat.exists') | min
        fail_msg: "RHACM kubeconfig, pull secret, and SSH public key must all exist."

    - name: Query requested phoenixNAP SKU availability only for missing sites in static-SKU mode
      ansible.builtin.uri:
        url: >-
          {{ phoenixnap.api_base }}/billing/v1/product-availability?productCategory=SERVER&productCode={{ item.value.server_type | default(phoenixnap.server_type) }}&location={{ item.value.location }}&minQuantity=1&showOnlyMinQuantityAvailable=false
        method: GET
        headers:
          Authorization: "Bearer {{ pnap_token }}"
        return_content: true
        status_code: 200
      loop: "{{ sites | dict2items }}"
      register: pnap_site_availability_raw
      no_log: true
      when:
        - not (phoenixnap.auto_select.enabled | bool)
        - item.key in pnap_sites_needing_capacity

    - name: Build sanitized requested-SKU availability map
      ansible.builtin.set_fact:
        pnap_site_availability: >-
          {{ pnap_site_availability | default({}) | combine({
            item.item.key: {
              'server_type': item.item.value.server_type | default(phoenixnap.server_type),
              'location': item.item.value.location,
              'available': (
                item.json | default([])
                | selectattr('productCode', 'equalto', item.item.value.server_type | default(phoenixnap.server_type))
                | map(attribute='locationAvailabilityDetails') | list | flatten
                | selectattr('location', 'equalto', item.item.value.location)
                | selectattr('minQuantityAvailable', 'equalto', true)
                | list | length > 0
              ),
              'available_quantity': (
                item.json | default([])
                | selectattr('productCode', 'equalto', item.item.value.server_type | default(phoenixnap.server_type))
                | map(attribute='locationAvailabilityDetails') | list | flatten
                | selectattr('location', 'equalto', item.item.value.location)
                | map(attribute='availableQuantity') | list | first | default(0)
              )
            }
          }) }}
      loop: "{{ pnap_site_availability_raw.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key | default('skipped') }}"
      no_log: true
      when:
        - not (phoenixnap.auto_select.enabled | bool)
        - not (item.skipped | default(false) | bool)

    - name: Require requested static SKU only where a new server is missing
      ansible.builtin.assert:
        that:
          - pnap_site_availability[item.key].available | bool
        fail_msg: >-
          {{ item.value.server_type | default(phoenixnap.server_type) }} is not currently available in
          {{ item.value.location }} for {{ item.key }} (availableQuantity={{ pnap_site_availability[item.key].available_quantity }}).
          Run `make availability` to list SKUs with actual live stock, then set sites.{{ item.key }}.server_type
          to an approved alternative.
      loop: "{{ sites | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value.server_type | default(phoenixnap.server_type) }}@{{ item.value.location }}"
      when:
        - not (phoenixnap.auto_select.enabled | bool)
        - item.key in pnap_sites_needing_capacity

    - name: Report static-SKU sites that will reuse existing servers
      ansible.builtin.debug:
        msg: >-
          {{ item.key | upper }}: existing {{ item.value.node_hostname }} is already deployed in
          {{ item.value.location }}; live stock is not a prerequisite for this rerun.
      loop: "{{ sites | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - not (phoenixnap.auto_select.enabled | bool)
        - item.key not in pnap_sites_needing_capacity

    - name: Display requested static OpenShift Virtualization shapes for missing sites
      ansible.builtin.debug:
        msg: >-
          {{ item.key | upper }}: requested {{ item.value.server_type | default(phoenixnap.server_type) }}
          is available in {{ item.value.location }} and will be provisioned HOURLY.
      loop: "{{ sites | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - not (phoenixnap.auto_select.enabled | bool)
        - item.key in pnap_sites_needing_capacity

    - name: Summarize idempotent dynamic server decision
      ansible.builtin.debug:
        msg: >-
          {% if pnap_selected_skus[item.key].reusedExisting | default(false) | bool %}
          {{ item.key | upper }}: reuse existing {{ item.value.node_hostname }}
          ({{ pnap_selected_skus[item.key].productCode }} in {{ item.value.location }}); no live stock required.
          {% else %}
          {{ item.key | upper }}: provision {{ pnap_selected_skus[item.key].productCode }} @
          ${{ '%.3f' | format(pnap_selected_skus[item.key].hourlyPrice | float) }}/h in {{ item.value.location }}.
          {% endif %}
      loop: "{{ sites | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: phoenixnap.auto_select.enabled | bool

    - name: Verify RHACM hub access
      kubernetes.core.k8s_info:
        kubeconfig: "{{ rhacm.kubeconfig }}"
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: hub_version

    - name: Require a reachable OpenShift hub
      ansible.builtin.assert:
        that:
          - hub_version.resources | length == 1
        fail_msg: "Cannot query the RHACM hub with RHACM_KUBECONFIG."
