---
- name: Preflight external services and capacity
  hosts: localhost
  gather_facts: false
  roles:
    - role: pnap_auth
  tasks:
    - name: Require secret environment variables and files
      ansible.builtin.assert:
        that:
          - lookup('env', 'PNAP_CLIENT_ID') | length > 0
          - lookup('env', 'PNAP_CLIENT_SECRET') | length > 0
          - lookup('env', 'CLOUDFLARE_API_TOKEN') | length > 0
          - rhacm.kubeconfig | length > 0
          - openshift_pull_secret_file | length > 0
        fail_msg: "Source .env (copied from .env.example) and provide the required paths/secrets."

    - name: Check local credential files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ rhacm.kubeconfig }}"
        - "{{ openshift_pull_secret_file }}"
        - "{{ ssh_public_key.path }}"
      register: credential_files

    - name: Require local credential files to exist
      ansible.builtin.assert:
        that:
          - credential_files.results | map(attribute='stat.exists') | min
        fail_msg: "RHACM kubeconfig, pull secret, and SSH public key must all exist."

    - name: Query phoenixNAP product availability
      ansible.builtin.uri:
        url: >-
          {{ phoenixnap.api_base }}/billing/v1/product-availability?productCategory=SERVER&productCode={{ phoenixnap.server_type }}&minQuantity=1
        method: GET
        headers:
          Authorization: "Bearer {{ pnap_token }}"
        return_content: true
        status_code: 200
      register: pnap_availability
      no_log: true

    - name: Extract requested product availability
      ansible.builtin.set_fact:
        pnap_product: >-
          {{ (pnap_availability.json | selectattr('productCode', 'equalto', phoenixnap.server_type) | list | first) | default({}) }}

    - name: Require requested SKU in both regions
      ansible.builtin.assert:
        that:
          - >-
            (pnap_product.locationAvailabilityDetails | default([])
            | selectattr('location', 'equalto', item.value.location)
            | selectattr('minQuantityAvailable', 'equalto', true)
            | list | length) > 0
        fail_msg: "{{ phoenixnap.server_type }} is not currently available in {{ item.value.location }}."
      loop: "{{ sites | dict2items }}"

    - name: Display SNO sizing warning
      ansible.builtin.debug:
        msg: >-
          Requested {{ phoenixnap.server_type }} is intentionally permitted for this
          OpenShift 4.22 lab. It is below the 8-vCPU recommended SNO topology;
          {{ phoenixnap.recommended_server_type }} provides more virtualization headroom.
      when: phoenixnap.server_type == 's2.c1.small'

    - name: Verify RHACM hub access
      kubernetes.core.k8s_info:
        kubeconfig: "{{ rhacm.kubeconfig }}"
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: hub_version

    - name: Require a reachable OpenShift hub
      ansible.builtin.assert:
        that:
          - hub_version.resources | length == 1
        fail_msg: "Cannot query the RHACM hub with RHACM_KUBECONFIG."
