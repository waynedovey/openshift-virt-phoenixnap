---
- name: Validate local configuration
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Report repository revision
      ansible.builtin.debug:
        msg: >-
          openshift-virt-phoenixnap {{ lookup('file', playbook_dir ~ '/../VERSION') | trim }}.
          If this does not match the ZIP you just installed, stop before troubleshooting
          later tasks because the working tree was not updated.

    - name: Require native-iPXE-capable phoenixNAP locations
      ansible.builtin.assert:
        that:
          - sites.sw1.location in phoenixnap.ipxe_network.supported_locations
          - sites.c1.location in phoenixnap.ipxe_network.supported_locations
          - sites.sw1.location != sites.c1.location
        fail_msg: >-
          This lab provisions servers with phoenixNAP native `os: ipxe`.
          Configured locations are SW1={{ sites.sw1.location }}, C1={{ sites.c1.location }}.
          The currently confirmed native-iPXE locations for this workflow are
          {{ phoenixnap.ipxe_network.supported_locations | join(', ') }}.
          The live BMC API rejected CHI for `os: ipxe`; use ASH (default) or NLD for C1,
          or implement a separate RAM-OS/kexec bootstrap before using CHI.

    - name: Validate static project settings
      ansible.builtin.assert:
        that:
          - base_domain == 'digitaldovey.net'
          - ocp_minor == '4.22'
          - rhacm.existing_hub | bool
          - rhacm.api | length > 0
          - phoenixnap.auto_select.max_hourly_price | float > 0
          - phoenixnap.auto_select.max_hourly_price | float <= 0.30
          - phoenixnap.auto_select.min_ram_gb | int >= 32
          - phoenixnap.auto_select.min_cores | int >= 4
          - phoenixnap.network_type == 'PUBLIC_AND_PRIVATE'
          - sites.sw1.cluster_network != sites.c1.cluster_network
          - sites.sw1.service_network != sites.c1.service_network
          - evpn.vm_subnet | length > 0
          - sites.sw1.private_l2.cidr != sites.c1.private_l2.cidr
          - vm_l2.network_name | length > 0
          - evpn.fabric_mode in ['fabric-router', 'external', 'self-managed-vxlan']
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.transport.vni | int != evpn.vni | int
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.transport.udp_port | int > 0
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.transport.udp_port | int <= 65535
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.transport.udp_port | int != 4789
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.vm_mtu | int <= (evpn.transport.mtu | int - 50)
          - evpn.fabric_mode != 'self-managed-vxlan' or evpn.transport.addresses.sw1 != evpn.transport.addresses.c1
          - evpn.fabric_mode != 'fabric-router' or evpn.fabric_router.asn | int > 0
          - evpn.fabric_mode != 'fabric-router' or evpn.fabric_router.auto_select.max_hourly_price | float > 0
          - evpn.fabric_mode != 'fabric-router' or evpn.fabric_router.auto_select.max_hourly_price | float <= 0.30
          - evpn.fabric_mode != 'fabric-router' or evpn.fabric_router.auto_provision | bool or evpn.fabric_router.address | length > 0
          - evpn.fabric_mode != 'fabric-router' or evpn.fabric_router.auto_provision | bool or not (evpn.bgp_auth.enabled | bool) or evpn.fabric_router.password | length > 0
          - evpn.addressing.sw1.default_gateway != evpn.addressing.c1.default_gateway
          - evpn.addressing.sw1.infrastructure_subnet != evpn.addressing.c1.infrastructure_subnet
          - evpn.addressing.sw1.reserved_subnets != evpn.addressing.c1.reserved_subnets
          - sites.sw1.bgp_asn | int != sites.c1.bgp_asn | int
        fail_msg: "Review inventories/lab/group_vars/all.yml."

    - name: Explain EVPN deployment behavior
      ansible.builtin.debug:
        msg: >-
          EVPN platform_apply={{ evpn.platform_apply | default(true) }},
          fabric_mode={{ evpn.fabric_mode }},
          fabric_required={{ evpn.fabric_required | default(false) }}.
          {% if evpn.fabric_mode == 'fabric-router' %}
          SW1 and C1 will actively dial one FRR EVPN fabric router (AS{{ evpn.fabric_router.asn }}).
          The fabric router carries only MP-BGP control-plane traffic; OpenShift VNI
          {{ evpn.vni }} uses direct UDP/4789 between the SNO public VTEPs.
          auto_provision={{ evpn.fabric_router.auto_provision | bool }}.
          {% elif evpn.fabric_mode == 'self-managed-vxlan' %}
          LEGACY mode: build a {{ sites.sw1.location }}<->{{ sites.c1.location }} outer
          VXLAN carrier over UDP/{{ evpn.transport.udp_port }}. This mode is retained
          for diagnostics but failed on the tested PHX<->ASH provider path.
          {% else %}
          External mode uses the supplied provider EVPN peer addresses/ASN.
          {% endif %}
