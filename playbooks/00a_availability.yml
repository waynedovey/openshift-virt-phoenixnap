---
- name: Show phoenixNAP budget-aware live server choices
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Require native-iPXE-capable phoenixNAP locations
      ansible.builtin.assert:
        that:
          - sites.sw1.location in phoenixnap.ipxe_network.supported_locations
          - sites.c1.location in phoenixnap.ipxe_network.supported_locations
          - sites.sw1.location != sites.c1.location
        fail_msg: >-
          This lab provisions servers with phoenixNAP native `os: ipxe`.
          Configured locations are SW1={{ sites.sw1.location }}, C1={{ sites.c1.location }}, but the
          provider-supported native-iPXE list in this repo is
          {{ phoenixnap.ipxe_network.supported_locations | join(', ') }}.
          CHI currently rejects `os: ipxe`; use ASH (default) or NLD for C1, or implement
          a separate RAM-OS/kexec bootstrap path before using CHI.
  roles:
    - role: pnap_auth
    - role: pnap_select_sku
  tasks:
    - name: Display existing deployed sites excluded from capacity requirements
      ansible.builtin.debug:
        msg: >-
          {{ item.key | upper }} / {{ sites[item.key].location }}: existing server
          {{ item.value.hostname }} ({{ item.value.productCode }}, status={{ item.value.status }}) will be reused.
          Remaining provider stock is informational and is not required by `make deploy`.
      loop: "{{ pnap_existing_server_reuse_rows | dict2items }}"
      loop_control:
        label: "{{ item.key }} / {{ sites[item.key].location }}"
      when: not (pnap_force_capacity_selection | default(false) | bool)

    - name: Display top budget-qualified candidates for sites that still need capacity
      ansible.builtin.debug:
        msg: >-
          {{ item.key | upper }} / {{ sites[item.key].location }} candidates under
          ${{ '%.2f' | format(phoenixnap.auto_select.max_hourly_price | float) }}/h:
          {% for c in item.value %}{{ c.productCode }}=${{ '%.3f' | format(c.hourlyPrice | float) }}/h
          ({{ c.ramInGb }}GB/{{ c.cores }} cores, disks={{ c.storageDeviceCount | default("?") }}, storage={{ c.storage | default("unknown") }}, stock={{ c.availableQuantity }}){% if not loop.last %}; {% endif %}{% endfor %}
      loop: "{{ pnap_sku_selection.candidates | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }} / {{ sites[item.key].location }}"
      when: phoenixnap.auto_select.enabled | bool

    - name: Display final dynamic capacity decision per site
      ansible.builtin.debug:
        msg: >-
          {% if pnap_selected_skus[item.key].reusedExisting | default(false) | bool %}
          {{ item.key | upper }}: REUSE {{ pnap_selected_skus[item.key].productCode }} already deployed in {{ item.value.location }}.
          {% else %}
          {{ item.key | upper }}: SELECT {{ pnap_selected_skus[item.key].productCode }} @
          ${{ '%.3f' | format(pnap_selected_skus[item.key].hourlyPrice | float) }}/h in {{ item.value.location }}.
          {% endif %}
      loop: "{{ sites | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: phoenixnap.auto_select.enabled | bool
