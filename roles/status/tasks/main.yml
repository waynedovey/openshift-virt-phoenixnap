---
- name: List phoenixNAP servers
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: status_servers
  no_log: true

- name: Show phoenixNAP SNO server state
  ansible.builtin.debug:
    msg: >-
      {{ item.value.cluster_name }}: {{ item.value.node_hostname }} =
      {{ ((status_servers.json | selectattr('hostname', 'equalto', item.value.node_hostname) | list | first).status) | default('not-found') }}
  loop: "{{ sites | dict2items }}"


- name: List phoenixNAP BGP peer groups
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/bgp-peer-groups"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: status_bgp
  no_log: true

- name: Build sanitized BGP peer-group status
  ansible.builtin.set_fact:
    status_bgp_sanitized: >-
      {{ status_bgp_sanitized | default([]) + [
        {
          'location': item.location,
          'status': item.status,
          'asn': item.activeAsnDetails.asn | default(item.targetAsnDetails.asn),
          'loopbacks': item.peeringLoopbacksV4 | default([])
        }
      ] }}
  loop: "{{ status_bgp.json }}"
  when: item.location in [sites.sw1.location, sites.c1.location]
  no_log: true

- name: Show sanitized BGP peer-group state
  ansible.builtin.debug:
    msg: >-
      {{ item.location }}: status={{ item.status }}, ASN={{ item.asn }},
      loopbacks={{ item.loopbacks }}
  loop: "{{ status_bgp_sanitized | default([]) }}"
  loop_control:
    label: "{{ item.location }}"

- name: Show RHACM install state
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: extensions.hive.openshift.io/v1beta1
    kind: AgentClusterInstall
    name: "{{ item.value.cluster_name }}"
    namespace: "{{ item.value.cluster_name }}"
  loop: "{{ sites | dict2items }}"
  register: status_aci

- name: Explain EVPN state
  ansible.builtin.debug:
    msg: >-
      EVPN apply={{ evpn.apply }}, fabric_confirmed={{ evpn.fabric_confirmed }},
      shared VM subnet={{ evpn.vm_subnet }}, VNI={{ evpn.vni }}.

- name: List phoenixNAP private networks
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: status_private_networks
  no_log: true

- name: Show site-local private Layer2 network state
  ansible.builtin.debug:
    msg: >-
      {{ item.key }}: server={{ ((status_servers.json | selectattr('hostname', 'equalto', item.value.node_hostname) | list | first).type) | default('not-created') }},
      selection-mode={{ 'auto' if phoenixnap.auto_select.enabled | bool else 'static' }},
      private-L2={{ item.value.private_l2.name }},
      provider-CIDR=none, guest-CIDR={{ item.value.private_l2.cidr }},
      VLAN={{ ((status_private_networks.json
        | selectattr('name', 'equalto', item.value.private_l2.name)
        | selectattr('location', 'equalto', item.value.location)
        | list | first).vlanId) | default('not-created') }}
  loop: "{{ sites | dict2items }}"

- name: Show LVM StorageClass state per site
  kubernetes.core.k8s_info:
    kubeconfig: "artifacts/kubeconfigs/{{ item.value.cluster_name }}.kubeconfig"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "lvms-{{ lvm_storage.device_class }}"
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: status_lvms_sc
  when: lvm_storage.enabled | bool

- name: Report LVM StorageClass state
  ansible.builtin.debug:
    msg: >-
      {{ item.item.key }}: lvms-{{ lvm_storage.device_class }}={{ 'ready' if item.resources | default([]) | length == 1 else 'not-created' }}
  loop: "{{ status_lvms_sc.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('site') }}"
  when:
    - lvm_storage.enabled | bool
    - item.skipped is not defined or not item.skipped

- name: Read EVPN proof VMs when shared fabric is enabled
  kubernetes.core.k8s_info:
    kubeconfig: "artifacts/kubeconfigs/{{ item.value.cluster_name }}.kubeconfig"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "rhel9-{{ item.key }}"
    namespace: "{{ evpn.namespace }}"
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: status_evpn_vms
  when:
    - virtualization.enabled | bool
    - evpn.apply | bool
    - evpn.fabric_confirmed | bool
    - evpn_test_vms.enabled | bool
    - evpn_test_vms.apply | bool

- name: Report EVPN proof VMs
  ansible.builtin.debug:
    msg: >-
      {{ item.item.key }}: rhel9-{{ item.item.key }}={{
        (item.resources[0].status.printableStatus | default('created'))
        if item.resources | default([]) | length == 1 else 'not-created' }},
      expected-IP={{ evpn_test_vms.ips[item.item.key] }}
  loop: "{{ status_evpn_vms.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('site') }}"
  when:
    - evpn.apply | bool
    - evpn.fabric_confirmed | bool
    - item.skipped is not defined or not item.skipped
