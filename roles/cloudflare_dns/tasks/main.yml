---
- name: Require Cloudflare token
  ansible.builtin.assert:
    that:
      - lookup('env', 'CLOUDFLARE_API_TOKEN') | length > 0
    fail_msg: "CLOUDFLARE_API_TOKEN is required."

- name: Resolve Cloudflare zone ID
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ cloudflare.zone }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
    return_content: true
    status_code: 200
  register: cf_zone
  no_log: true

- name: Require exactly one Cloudflare zone
  ansible.builtin.assert:
    that:
      - cf_zone.json.success | bool
      - cf_zone.json.result | length == 1
    fail_msg: "Cloudflare zone {{ cloudflare.zone }} is unavailable to this API token."

- name: Store Cloudflare zone ID
  ansible.builtin.set_fact:
    cf_zone_id: "{{ cf_zone.json.result[0].id }}"
  no_log: true

- name: List phoenixNAP servers for DNS source addresses
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: pnap_servers_dns
  no_log: true

- name: Upsert DNS for each SNO site
  ansible.builtin.include_tasks: site.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
