---
- name: Set EVPN network facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_peer_address: >-
      {{ evpn.transport.addresses['c1' if site_item.key == 'sw1' else 'sw1']
         if evpn.fabric_mode == 'self-managed-vxlan'
         else ((evpn_embedded_router_local_address
                if site_item.key == evpn.embedded_router.site
                else evpn_embedded_router_public_address)
               if evpn.fabric_mode == 'embedded-router'
               else evpn.peers[site_item.key]) }}
    evpn_peer_asn_effective: >-
      {{ sites['c1' if site_item.key == 'sw1' else 'sw1'].bgp_asn
         if evpn.fabric_mode == 'self-managed-vxlan'
         else (evpn.embedded_router.asn
               if evpn.fabric_mode == 'embedded-router'
               else evpn.peer_asn) }}
    evpn_effective_vtep_ip: >-
      {{ evpn_site_public_ips[site_item.key]
         if evpn.fabric_mode == 'embedded-router'
         else site_item.value.vtep_ip }}
    evpn_effective_vtep_cidr: >-
      {{ evpn_site_public_ips[site_item.key] ~ '/32'
         if evpn.fabric_mode == 'embedded-router'
         else evpn.legacy_vtep_cidr }}
    evpn_site_addressing: "{{ evpn.addressing[site_item.key] }}"

- name: Read existing EVPN ClusterUserDefinedNetwork before immutable reconciliation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
  register: evpn_existing_cudn

- name: Publish existing immutable EVPN CUDN fields
  ansible.builtin.set_fact:
    evpn_existing_network: >-
      {{ evpn_existing_cudn.resources[0].spec.network
         if evpn_existing_cudn.resources | length == 1 else {} }}
    evpn_existing_layer2: >-
      {{ evpn_existing_cudn.resources[0].spec.network.layer2
         if evpn_existing_cudn.resources | length == 1 else {} }}
    evpn_existing_evpn: >-
      {{ evpn_existing_cudn.resources[0].spec.network.evpn
         if evpn_existing_cudn.resources | length == 1 else {} }}

- name: Detect immutable EVPN CUDN drift
  ansible.builtin.set_fact:
    evpn_cudn_requires_recreate: >-
      {{
        evpn_existing_cudn.resources | length == 1 and
        (
          evpn_existing_network.get('topology', '') != 'Layer2' or
          evpn_existing_network.get('transport', '') != 'EVPN' or
          evpn_existing_layer2.get('role', '') != 'Primary' or
          (evpn_existing_layer2.get('mtu', 0) | int) != (evpn.vm_mtu | int) or
          evpn_existing_layer2.get('subnets', []) != [evpn.vm_subnet] or
          (evpn_existing_layer2.get('ipam', {}).get('mode', 'Enabled')) != 'Enabled' or
          (evpn_existing_layer2.get('ipam', {}).get('lifecycle', '')) != 'Persistent' or
          evpn_existing_layer2.get('defaultGatewayIPs', []) != [evpn_site_addressing.default_gateway] or
          evpn_existing_layer2.get('infrastructureSubnets', []) != [evpn_site_addressing.infrastructure_subnet] or
          evpn_existing_layer2.get('reservedSubnets', []) != evpn_site_addressing.reserved_subnets or
          evpn_existing_evpn.get('vtep', '') != 'evpn-vtep' or
          (evpn_existing_evpn.get('macVRF', {}).get('vni', 0) | int) != (evpn.vni | int) or
          evpn_existing_evpn.get('macVRF', {}).get('routeTarget', '') != evpn.route_target
        )
      }}

- name: Read EVPN VMs before replacing immutable drifted CUDN
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ evpn.namespace }}"
  register: evpn_existing_vms_before_cudn_recreate
  when: evpn_cudn_requires_recreate | bool

- name: Read running EVPN VMIs before replacing immutable drifted CUDN
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: "{{ evpn.namespace }}"
  register: evpn_existing_vmis_before_cudn_recreate
  when: evpn_cudn_requires_recreate | bool

- name: Require EVPN namespace to be empty before immutable CUDN replacement
  ansible.builtin.assert:
    that:
      - evpn_existing_vms_before_cudn_recreate.resources | length == 0
      - evpn_existing_vmis_before_cudn_recreate.resources | length == 0
    fail_msg: >-
      {{ evpn.network_name }} has immutable addressing/EVPN fields that differ from
      the desired OpenShift 4.22 primary-CUDN layout, but {{ evpn.namespace }} contains
      VMs/VMIs. Stop and remove the EVPN proof workloads first, then rerun make evpn.
  when: evpn_cudn_requires_recreate | bool

- name: Delete immutable drifted EVPN CUDN before recreation
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: evpn_cudn_requires_recreate | bool

- name: Create shared Layer2 EVPN ClusterUserDefinedNetwork
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: ClusterUserDefinedNetwork
      metadata:
        name: "{{ evpn.network_name }}"
        labels:
          digitaldovey.net/evpn: enabled
      spec:
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: "{{ evpn.namespace }}"
        network:
          topology: Layer2
          layer2:
            role: Primary
            mtu: "{{ evpn.vm_mtu | int }}"
            ipam:
              mode: Enabled
              lifecycle: Persistent
            subnets:
              - "{{ evpn.vm_subnet }}"
            defaultGatewayIPs:
              - "{{ evpn_site_addressing.default_gateway }}"
            infrastructureSubnets:
              - "{{ evpn_site_addressing.infrastructure_subnet }}"
            reservedSubnets: "{{ evpn_site_addressing.reserved_subnets }}"
          transport: EVPN
          evpn:
            vtep: evpn-vtep
            macVRF:
              vni: "{{ evpn.vni | int }}"
              routeTarget: "{{ evpn.route_target }}"

- name: Create RouteAdvertisements selecting FRR and EVPN CUDN labels
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: RouteAdvertisements
      metadata:
        name: evpn-vm-routes
      spec:
        targetVRF: auto
        advertisements:
          - PodNetwork
        nodeSelector: {}
        frrConfigurationSelector:
          matchLabels:
            digitaldovey.net/evpn-fabric: enabled
        networkSelectors:
          - networkSelectionType: ClusterUserDefinedNetworks
            clusterUserDefinedNetworkSelector:
              networkSelector:
                matchLabels:
                  digitaldovey.net/evpn: enabled

- name: Wait for EVPN CUDN acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
  register: evpn_cudn_status
  until: >-
    evpn_cudn_status.resources | length == 1 and
    (evpn_cudn_status.resources[0].status.conditions | default([])
      | selectattr('status', 'equalto', 'True')
      | selectattr('reason', 'equalto', 'EVPNTransportAccepted')
      | list | length) > 0
  retries: 90
  delay: 10

- name: Wait for RouteAdvertisements acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: RouteAdvertisements
    name: evpn-vm-routes
  register: route_advertisements_status
  until: >-
    route_advertisements_status.resources | length == 1 and
    (route_advertisements_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Accepted')
      | selectattr('status', 'equalto', 'True')
      | list | length) > 0
  retries: 90
  delay: 10

- name: Save EVPN configuration state
  ansible.builtin.copy:
    dest: "artifacts/networks/{{ site_item.key }}-evpn.yml"
    mode: '0600'
    content: |
      cluster: {{ site_item.value.cluster_name }}
      fabric_mode: {{ evpn.fabric_mode }}
      local_asn: {{ site_item.value.bgp_asn }}
      peer: {{ evpn_peer_address }}
      peer_asn: {{ evpn_peer_asn_effective }}
      vtep_ip: {{ evpn_effective_vtep_ip }}
      vtep_cidr: {{ evpn_effective_vtep_cidr }}
      namespace: {{ evpn.namespace }}
      cudn: {{ evpn.network_name }}
      vm_subnet: {{ evpn.vm_subnet }}
      vm_mtu: {{ evpn.vm_mtu }}
      ipam_mode: Enabled
      ipam_lifecycle: Persistent
      default_gateway: {{ evpn_site_addressing.default_gateway }}
      infrastructure_subnet: {{ evpn_site_addressing.infrastructure_subnet }}
      reserved_subnets: {{ evpn_site_addressing.reserved_subnets | to_json }}
      vni: {{ evpn.vni }}
      route_target: {{ evpn.route_target }}
      dataplane: direct-vxlan-udp-4789
      legacy_transit_interface: {{ evpn.transport.interface if evpn.fabric_mode == 'self-managed-vxlan' else 'none' }}
