---
- name: Set self-managed EVPN transit facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_transit_local_public_ip: "{{ evpn_server_state[site_item.key].public_ip }}"
    evpn_transit_remote_public_ip: >-
      {{ evpn_server_state['c1' if site_item.key == 'sw1' else 'sw1'].public_ip }}
    evpn_transit_local_ip: "{{ evpn.transport.addresses[site_item.key] }}"
    evpn_transit_remote_ip: >-
      {{ evpn.transport.addresses['c1' if site_item.key == 'sw1' else 'sw1'] }}

- name: Create cross-site VXLAN transit interface for the EVPN underlay
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: nmstate.io/v1
      kind: NodeNetworkConfigurationPolicy
      metadata:
        name: evpn-cross-site-transit
      spec:
        nodeSelector: {}
        desiredState:
          interfaces:
            - name: "{{ evpn.transport.interface }}"
              description: "Lab cross-site routed transit for OpenShift BGP EVPN"
              type: vxlan
              state: up
              mtu: "{{ evpn.transport.mtu | int }}"
              ipv4:
                enabled: true
                dhcp: false
                address:
                  - ip: "{{ evpn_transit_local_ip }}"
                    prefix-length: "{{ evpn.transport.prefix_length | int }}"
              ipv6:
                enabled: false
              vxlan:
                base-iface: "{{ phoenixnap.ipxe_network.bond_name }}"
                id: "{{ evpn.transport.vni | int }}"
                local: "{{ evpn_transit_local_public_ip }}"
                remote: "{{ evpn_transit_remote_public_ip }}"
                learning: false
                destination-port: "{{ evpn.transport.udp_port | int }}"
          # FRR-K8s resolves BGP neighbors from the host main routing table.
          # Keep an explicit host route to the opposite transit endpoint so the
          # overlay remains reachable even if NetworkManager does not expose the
          # VXLAN connected prefix to table 254 in the way FRR expects.
          routes:
            config:
              - destination: "{{ evpn_transit_remote_ip }}/32"
                next-hop-interface: "{{ evpn.transport.interface }}"
                table-id: 254
                metric: 50

- name: Wait for cross-site EVPN transit interface policy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: nmstate.io/v1
    kind: NodeNetworkConfigurationPolicy
    name: evpn-cross-site-transit
  register: evpn_transit_nncp
  until: >-
    evpn_transit_nncp.resources | length == 1 and
    (evpn_transit_nncp.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True')
      | list | length) > 0
  retries: 90
  delay: 10
  ignore_errors: true

- name: Read NMState enactments when the transit policy is not Available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: nmstate.io/v1
    kind: NodeNetworkConfigurationEnactment
  register: evpn_transit_nnce
  failed_when: false
  when: >-
    evpn_transit_nncp.resources | default([]) | length != 1 or
    (evpn_transit_nncp.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 0

- name: Build NMState transit failure summary
  ansible.builtin.set_fact:
    evpn_transit_nnce_errors: >-
      {{ evpn_transit_nnce.resources | default([])
         | selectattr('metadata.name', 'search', 'evpn-cross-site-transit')
         | map(attribute='status')
         | map(attribute='conditions')
         | list }}
  when: >-
    evpn_transit_nncp.resources | default([]) | length != 1 or
    (evpn_transit_nncp.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 0

- name: Require cross-site EVPN transit policy to become Available
  ansible.builtin.assert:
    that:
      - evpn_transit_nncp.resources | default([]) | length == 1
      - >-
        (evpn_transit_nncp.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Available')
          | selectattr('status', 'equalto', 'True')
          | list | length) > 0
    fail_msg: >-
      {{ site_item.key }} NNCP/evpn-cross-site-transit did not become Available.
      The requested outer carrier is VXLAN VNI {{ evpn.transport.vni }} on
      UDP/{{ evpn.transport.udp_port }}. NNCE condition summary:
      {{ evpn_transit_nnce_errors | default([]) }}.
      Run 'oc --kubeconfig {{ managed_kubeconfig }} get nnce -o yaml' for the full
      per-node NMState error. UDP/4789 is intentionally rejected for this outer
      carrier because it is reserved for the OpenShift EVPN data plane.

- name: Report cross-site EVPN transit
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }}: {{ evpn.transport.interface }}={{ evpn_transit_local_ip }}/{{ evpn.transport.prefix_length }}
      over VXLAN VNI {{ evpn.transport.vni }} UDP/{{ evpn.transport.udp_port }};
      public outer {{ evpn_transit_local_public_ip }} -> {{ evpn_transit_remote_public_ip }}.
