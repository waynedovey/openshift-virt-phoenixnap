---
- name: Set EVPN BGP peer facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_peer_address: >-
      {{ evpn.transport.addresses['c1' if site_item.key == 'sw1' else 'sw1']
         if evpn.fabric_mode == 'self-managed-vxlan'
         else ((evpn_embedded_router_local_address
                if site_item.key == evpn.embedded_router.site
                else evpn_embedded_router_public_address)
               if evpn.fabric_mode == 'embedded-router'
               else evpn.peers[site_item.key]) }}
    evpn_peer_asn_effective: >-
      {{ sites['c1' if site_item.key == 'sw1' else 'sw1'].bgp_asn
         if evpn.fabric_mode == 'self-managed-vxlan'
         else (evpn.embedded_router.asn
               if evpn.fabric_mode == 'embedded-router'
               else evpn.peer_asn) }}
    evpn_router_id: >-
      {{ evpn.transport.addresses[site_item.key]
         if evpn.fabric_mode == 'self-managed-vxlan'
         else (evpn_site_public_ips[site_item.key]
               if evpn.fabric_mode == 'embedded-router'
               else site_item.value.vtep_ip) }}

- name: Create BGP authentication secret for lab-managed EVPN fabric
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ evpn.bgp_auth.secret_name }}"
        namespace: openshift-frr-k8s
      type: kubernetes.io/basic-auth
      stringData:
        username: evpn
        password: "{{ evpn_bgp_password }}"
  no_log: true
  when:
    - evpn.fabric_mode in ['embedded-router', 'self-managed-vxlan']
    - evpn.bgp_auth.enabled | bool

- name: Build base EVPN BGP neighbor
  ansible.builtin.set_fact:
    evpn_neighbor_base: >-
      {{ {'address': evpn_peer_address, 'asn': (evpn_peer_asn_effective | int)}
         | combine({'ebgpMultiHop': true}
           if evpn.fabric_mode in ['embedded-router', 'self-managed-vxlan'] else {})
         | combine({'sourceaddress': evpn_site_public_ips[site_item.key],
                    'port': (evpn.embedded_router.listener_port | int)}
           if evpn.fabric_mode == 'embedded-router' else {}) }}

# FRR-K8s v1beta1 on OpenShift 4.22 expects passwordSecret as a
# SecretReference object with a name field.
- name: Add BGP authentication to lab-managed neighbor
  ansible.builtin.set_fact:
    evpn_neighbor: >-
      {{ evpn_neighbor_base | combine({'passwordSecret': {'name': evpn.bgp_auth.secret_name}})
         if (evpn.fabric_mode in ['embedded-router', 'self-managed-vxlan'] and
             evpn.bgp_auth.enabled | bool)
         else evpn_neighbor_base }}

- name: Configure EVPN BGP peer toward fabric
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: frrk8s.metallb.io/v1beta1
      kind: FRRConfiguration
      metadata:
        name: evpn-fabric
        namespace: openshift-frr-k8s
        labels:
          digitaldovey.net/evpn-fabric: enabled
      spec:
        nodeSelector: {}
        bgp:
          routers:
            - asn: "{{ site_item.value.bgp_asn | int }}"
              id: "{{ evpn_router_id }}"
              neighbors: "{{ [evpn_neighbor] }}"

- name: Report canonical EVPN BGP peer
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} FRR-K8s AS{{ site_item.value.bgp_asn }} will actively dial
      {{ evpn_peer_address }}:{{ evpn.embedded_router.listener_port if evpn.fabric_mode == 'embedded-router' else 179 }}
      AS{{ evpn_peer_asn_effective }}.
      {% if evpn.fabric_mode == 'embedded-router' %}
      sourceaddress={{ evpn_site_public_ips[site_item.key] }}. The listener is the
      embedded FRR route-server on {{ evpn.embedded_router.site }}; the OpenShift
      FRR-K8s speakers remain active-only BGP clients.
      {% endif %}
