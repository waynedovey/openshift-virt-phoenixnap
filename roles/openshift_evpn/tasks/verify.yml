---
- name: Set final EVPN verification facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_peer_address: >-
      {{ evpn.transport.addresses['c1' if site_item.key == 'sw1' else 'sw1']
         if evpn.fabric_mode == 'self-managed-vxlan'
         else ((evpn_embedded_router_local_address
                if site_item.key == evpn.embedded_router.site
                else evpn_embedded_router_public_address)
               if evpn.fabric_mode == 'embedded-router'
               else evpn.peers[site_item.key]) }}
    evpn_remote_vtep: >-
      {{ evpn_site_public_ips['c1' if site_item.key == 'sw1' else 'sw1']
         if evpn.fabric_mode == 'embedded-router'
         else sites['c1' if site_item.key == 'sw1' else 'sw1'].vtep_ip }}

- name: Get FRR-K8s pods for final EVPN verification
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: openshift-frr-k8s
  register: evpn_verify_frr_pods

- name: Build running FRR-K8s daemon pod list for final verification
  ansible.builtin.set_fact:
    evpn_verify_running_frr_pods: >-
      {{ evpn_verify_frr_pods.resources
         | rejectattr('metadata.name', 'search', 'statuscleaner')
         | selectattr('status.phase', 'equalto', 'Running')
         | list }}

- name: Require a running FRR-K8s daemon pod for final verification
  ansible.builtin.assert:
    that:
      - evpn_verify_running_frr_pods | length > 0
    fail_msg: "No running FRR-K8s daemon pod is available on {{ site_item.key }}."

- name: Select FRR-K8s daemon pod for final verification
  ansible.builtin.set_fact:
    evpn_frr_daemon_pod: "{{ (evpn_verify_running_frr_pods | first).metadata.name }}"

- name: Wait for MP-BGP L2VPN EVPN address family to be established
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ managed_kubeconfig }}"
    namespace: openshift-frr-k8s
    pod: "{{ evpn_frr_daemon_pod }}"
    container: frr
    command: "vtysh -c 'show bgp l2vpn evpn summary'"
  register: evpn_l2vpn_established
  until: >-
    evpn_peer_address in (evpn_l2vpn_established.stdout | default('')) and
    'NoNeg' not in (evpn_l2vpn_established.stdout | default('')) and
    'Connect' not in (evpn_l2vpn_established.stdout | default('')) and
    'Active' not in (evpn_l2vpn_established.stdout | default(''))
  retries: 90
  delay: 5
  changed_when: false
  failed_when: false

- name: Require MP-BGP EVPN negotiation to succeed
  ansible.builtin.assert:
    that:
      - evpn_peer_address in (evpn_l2vpn_established.stdout | default(''))
      - "'NoNeg' not in (evpn_l2vpn_established.stdout | default(''))"
      - "'Connect' not in (evpn_l2vpn_established.stdout | default(''))"
      - "'Active' not in (evpn_l2vpn_established.stdout | default(''))"
    fail_msg: >-
      {{ site_item.key }} did not negotiate L2VPN EVPN with {{ evpn_peer_address }}.
      {% if evpn.fabric_mode == 'embedded-router' %}
      Confirm the embedded route server activates this client under `address-family l2vpn evpn`
      and negotiates the L2VPN EVPN address family. IPv4-only BGP is not sufficient.
      {% else %}
      Confirm the provider fabric supports and negotiates the L2VPN EVPN AFI/SAFI.
      {% endif %}

- name: Get SNO node for direct remote-VTEP reachability verification
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: v1
    kind: Node
  register: evpn_verify_nodes
  when: evpn.fabric_mode == 'embedded-router'

- name: Require exactly one SNO node for direct remote-VTEP verification
  ansible.builtin.assert:
    that:
      - evpn_verify_nodes.resources | length == 1
    fail_msg: "Expected one SNO node on {{ site_item.key }} for EVPN VTEP verification."
  when: evpn.fabric_mode == 'embedded-router'

- name: Verify the remote public VTEP is routable directly through the host network
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ managed_kubeconfig }}"
      - debug
      - "node/{{ evpn_verify_nodes.resources[0].metadata.name }}"
      - --
      - chroot
      - /host
      - ip
      - route
      - get
      - "{{ evpn_remote_vtep }}"
  register: evpn_remote_public_vtep_route
  changed_when: false
  when: evpn.fabric_mode == 'embedded-router'

- name: Require direct routing to the remote public VTEP
  ansible.builtin.assert:
    that:
      - evpn_remote_public_vtep_route.rc | default(1) | int == 0
      - evpn_remote_vtep in (evpn_remote_public_vtep_route.stdout | default(''))
    fail_msg: >-
      {{ site_item.key }} cannot route directly to remote VTEP {{ evpn_remote_vtep }}.
      Embedded-router mode keeps VXLAN UDP/4789 in the PHX<->ASH data path; the route
      server is control-plane only.
  when: evpn.fabric_mode == 'embedded-router'

- name: Wait for remote OpenShift VTEP route in fabric-routed modes
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ managed_kubeconfig }}"
    namespace: openshift-frr-k8s
    pod: "{{ evpn_frr_daemon_pod }}"
    container: frr
    command: "vtysh -c 'show ip route {{ evpn_remote_vtep }}/32'"
  register: evpn_remote_vtep_route
  until: "evpn_remote_vtep in (evpn_remote_vtep_route.stdout | default(''))"
  retries: 90
  delay: 5
  changed_when: false
  when: evpn.fabric_mode != 'embedded-router'

- name: Read EVPN Type-2 MAC/IP route table
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ managed_kubeconfig }}"
    namespace: openshift-frr-k8s
    pod: "{{ evpn_frr_daemon_pod }}"
    container: frr
    command: "vtysh -c 'show bgp l2vpn evpn route type 2'"
  register: evpn_type2_routes
  changed_when: false

- name: Read EVPN Type-3 routes for embedded remote-VTEP verification
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ managed_kubeconfig }}"
    namespace: openshift-frr-k8s
    pod: "{{ evpn_frr_daemon_pod }}"
    container: frr
    command: "vtysh -c 'show bgp l2vpn evpn route type 3'"
  register: evpn_type3_routes
  changed_when: false
  when: evpn.fabric_mode == 'embedded-router'

- name: Read EVPN VNI state for embedded remote-VTEP verification
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ managed_kubeconfig }}"
    namespace: openshift-frr-k8s
    pod: "{{ evpn_frr_daemon_pod }}"
    container: frr
    command: "vtysh -c 'show evpn vni'"
  register: evpn_vni_state
  changed_when: false
  when: evpn.fabric_mode == 'embedded-router'

- name: Require bidirectional EVPN route propagation in embedded-router mode
  ansible.builtin.assert:
    that:
      - evpn_remote_vtep in (evpn_type3_routes.stdout | default(''))
      - (evpn.vni | string) in (evpn_vni_state.stdout | default(''))
      - >-
        ((evpn_vni_state.stdout | default(''))
          | regex_search('(?m)^' ~ (evpn.vni | string) ~ '\\s+L2\\s+\\S+\\s+\\d+\\s+\\d+\\s+[1-9]\\d*\\s+')) is not none
    fail_msg: >-
      {{ site_item.key }} has BGP up but has not imported the remote EVPN VTEP
      {{ evpn_remote_vtep }} for VNI {{ evpn.vni }}. This indicates asymmetric
      EVPN route propagation through the embedded route server; refusing to
      report the migration healthy.
  when: evpn.fabric_mode == 'embedded-router'

- name: Report final EVPN fabric state
  ansible.builtin.debug:
    msg:
      - "{{ site_item.key }}: MP-BGP EVPN negotiated with {{ evpn_peer_address }}"
      - >-
          {{ site_item.key }}: remote VTEP {{ evpn_remote_vtep }} is
          {{ 'directly routable over the public underlay' if evpn.fabric_mode == 'embedded-router'
             else 'present in the fabric routing table' }}
      - "Type-2 routes appear after EVPN workloads are running; current table lines={{ evpn_type2_routes.stdout_lines | default([]) | length }}"
