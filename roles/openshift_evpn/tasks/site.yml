---
- name: Set EVPN site facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_peer_address: "{{ evpn.peers[site_item.key] }}"

- name: Enable FRR and route advertisements in Cluster Network Operator
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: operator.openshift.io/v1
      kind: Network
      metadata:
        name: cluster
      spec:
        additionalRoutingCapabilities:
          providers:
            - FRR
        defaultNetwork:
          ovnKubernetesConfig:
            routeAdvertisements: Enabled
            gatewayConfig:
              routingViaHost: true
              ipForwarding: Global

# Kubernetes NMState is installed by playbooks/07b_nmstate.yml.

- name: Create dummy VTEP interface
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: nmstate.io/v1
      kind: NodeNetworkConfigurationPolicy
      metadata:
        name: evpn-vtep
      spec:
        nodeSelector: {}
        desiredState:
          interfaces:
            - name: evpn-vtep0
              type: dummy
              state: up
              ipv4:
                enabled: true
                address:
                  - ip: "{{ site_item.value.vtep_ip }}"
                    prefix-length: 32
                dhcp: false
              ipv6:
                enabled: false

- name: Wait for dummy VTEP interface policy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: nmstate.io/v1
    kind: NodeNetworkConfigurationPolicy
    name: evpn-vtep
  register: nncp_status
  until: >-
    nncp_status.resources | length == 1 and
    (nncp_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True')
      | list | length) > 0
  retries: 90
  delay: 10

- name: Read EVPN workload namespace before primary UDN creation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ evpn.namespace }}"
  register: evpn_workload_namespace

- name: Refuse an existing EVPN namespace without the immutable primary-UDN label
  ansible.builtin.assert:
    that:
      - (evpn_workload_namespace.resources[0].metadata.labels | default({})).get('k8s.ovn.org/primary-user-defined-network', '__missing__') == ''
    fail_msg: >-
      Namespace {{ evpn.namespace }} already exists without
      k8s.ovn.org/primary-user-defined-network="". OpenShift requires that label
      at namespace creation time for a primary UDN. Remove only that unused
      namespace and rerun EVPN configuration.
  when: evpn_workload_namespace.resources | length == 1

- name: Create primary-UDN EVPN workload namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ evpn.namespace }}"
        labels:
          k8s.ovn.org/primary-user-defined-network: ""
          digitaldovey.net/evpn: enabled
  when: evpn_workload_namespace.resources | length == 0

- name: Configure external EVPN BGP peer
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: frrk8s.metallb.io/v1beta1
      kind: FRRConfiguration
      metadata:
        name: evpn-fabric
        namespace: openshift-frr-k8s
        labels:
          digitaldovey.net/evpn-fabric: enabled
      spec:
        nodeSelector: {}
        bgp:
          routers:
            - asn: "{{ site_item.value.bgp_asn }}"
              neighbors:
                - address: "{{ evpn_peer_address }}"
                  asn: "{{ evpn.peer_asn }}"

- name: Create unmanaged VTEP definition
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: VTEP
      metadata:
        name: evpn-vtep
      spec:
        mode: Unmanaged
        cidrs:
          - "{{ evpn.vtep_cidr }}"

- name: Wait for VTEP acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: VTEP
    name: evpn-vtep
  register: vtep_status
  until: >-
    vtep_status.resources | length == 1 and
    (vtep_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Accepted')
      | selectattr('status', 'equalto', 'True')
      | list | length) > 0
  retries: 90
  delay: 10

- name: Read existing shared Layer2 EVPN ClusterUserDefinedNetwork
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
  register: existing_evpn_cudn

- name: Require an existing EVPN CUDN to use manual guest IP addressing
  ansible.builtin.assert:
    that:
      - existing_evpn_cudn.resources[0].spec.network.topology == 'Layer2'
      - existing_evpn_cudn.resources[0].spec.network.transport == 'EVPN'
      - existing_evpn_cudn.resources[0].spec.network.layer2.role == 'Primary'
      - existing_evpn_cudn.resources[0].spec.network.layer2.subnets is not defined
      - existing_evpn_cudn.resources[0].spec.network.evpn.macVRF.vni | int == evpn.vni | int
    fail_msg: >-
      {{ evpn.network_name }} already exists with an incompatible immutable CUDN
      specification. This lab requires Layer2/Primary/EVPN with no OVN-managed subnet,
      because the two clusters use deterministic guest addresses from
      {{ evpn.vm_subnet }} and must not allocate the same address independently.
  when: existing_evpn_cudn.resources | length == 1

- name: Create shared Layer2 EVPN ClusterUserDefinedNetwork with manual guest addressing
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: ClusterUserDefinedNetwork
      metadata:
        name: "{{ evpn.network_name }}"
        labels:
          digitaldovey.net/evpn: enabled
      spec:
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: "{{ evpn.namespace }}"
        network:
          topology: Layer2
          layer2:
            role: Primary
          transport: EVPN
          evpn:
            vtep: evpn-vtep
            macVRF:
              vni: "{{ evpn.vni }}"
              routeTarget: "{{ evpn.route_target }}"
  when: existing_evpn_cudn.resources | length == 0

- name: Wait for EVPN CUDN acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
  register: evpn_cudn_status
  until: >-
    evpn_cudn_status.resources | length == 1 and
    (evpn_cudn_status.resources[0].status.conditions | default([])
      | selectattr('reason', 'equalto', 'EVPNTransportAccepted')
      | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 90
  delay: 10

- name: Create RouteAdvertisements selecting FRR and EVPN CUDN labels
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: k8s.ovn.org/v1
      kind: RouteAdvertisements
      metadata:
        name: evpn-vm-routes
      spec:
        targetVRF: auto
        advertisements:
          - PodNetwork
        nodeSelector: {}
        frrConfigurationSelector:
          matchLabels:
            digitaldovey.net/evpn-fabric: enabled
        networkSelectors:
          - networkSelectionType: ClusterUserDefinedNetworks
            clusterUserDefinedNetworkSelector:
              networkSelector:
                matchLabels:
                  digitaldovey.net/evpn: enabled

- name: Wait for RouteAdvertisements acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: RouteAdvertisements
    name: evpn-vm-routes
  register: route_advertisements_status
  until: >-
    route_advertisements_status.resources | length == 1 and
    (route_advertisements_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Accepted')
      | selectattr('status', 'equalto', 'True')
      | list | length) > 0
  retries: 90
  delay: 10
