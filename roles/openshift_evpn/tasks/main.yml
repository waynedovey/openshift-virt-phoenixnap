---
- name: Check SNO server state artifacts for EVPN modes that use public node addresses
  ansible.builtin.stat:
    path: "artifacts/servers/{{ item }}.yml"
  loop:
    - sw1
    - c1
  register: evpn_server_artifact_stats
  when: evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']

- name: Require SNO server state artifacts for public-address EVPN modes
  ansible.builtin.assert:
    that:
      - evpn_server_artifact_stats.results | length == 2
      - evpn_server_artifact_stats.results | map(attribute='stat.exists') | min
    fail_msg: >-
      {{ evpn.fabric_mode }} requires artifacts/servers/sw1.yml and
      artifacts/servers/c1.yml so the current SNO public addresses are known.
      Run make deploy (or make provision/install) first.
  when: evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']

- name: Read SNO server state used by EVPN
  ansible.builtin.set_fact:
    evpn_server_state:
      sw1: "{{ lookup('ansible.builtin.file', 'artifacts/servers/sw1.yml') | from_yaml }}"
      c1: "{{ lookup('ansible.builtin.file', 'artifacts/servers/c1.yml') | from_yaml }}"
  when: evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']

- name: Publish current SNO public addresses used by EVPN
  ansible.builtin.set_fact:
    evpn_site_public_ips:
      sw1: "{{ evpn_server_state.sw1.public_ip }}"
      c1: "{{ evpn_server_state.c1.public_ip }}"
  when: evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']

- name: Check auto-provisioned EVPN fabric-router artifact
  ansible.builtin.stat:
    path: artifacts/evpn/fabric-router.yml
  register: evpn_fabric_router_artifact
  when:
    - evpn.fabric_mode == 'fabric-router'
    - evpn.fabric_router.auto_provision | bool

- name: Require auto-provisioned EVPN fabric-router artifact
  ansible.builtin.assert:
    that:
      - evpn_fabric_router_artifact.stat.exists | default(false) | bool
    fail_msg: >-
      EVPN_FR_AUTO_PROVISION=true but artifacts/evpn/fabric-router.yml is absent.
      Run `make evpn-fabric-router` or rerun `make deploy`; the fabric-router stage must
      complete before OpenShift EVPN peering is configured.
  when:
    - evpn.fabric_mode == 'fabric-router'
    - evpn.fabric_router.auto_provision | bool

- name: Read auto-provisioned EVPN fabric-router state
  ansible.builtin.set_fact:
    evpn_fabric_router_state: >-
      {{ lookup('ansible.builtin.file', 'artifacts/evpn/fabric-router.yml') | from_yaml }}
  when:
    - evpn.fabric_mode == 'fabric-router'
    - evpn.fabric_router.auto_provision | bool

- name: Resolve effective EVPN fabric-router address
  ansible.builtin.set_fact:
    evpn_fabric_router_address: >-
      {{ evpn.fabric_router.address
         if (evpn.fabric_router.address | length > 0)
         else ((evpn_fabric_router_state | default({})).public_ip | default('')) }}
  when: evpn.fabric_mode == 'fabric-router'

- name: Determine EVPN fabric readiness
  ansible.builtin.set_fact:
    evpn_self_managed_ready: >-
      {{
        evpn.fabric_mode == 'self-managed-vxlan' and
        (evpn_server_state.sw1.public_ip | default('') | length > 0) and
        (evpn_server_state.c1.public_ip | default('') | length > 0)
      }}
    evpn_fabric_router_ready: >-
      {{
        evpn.fabric_mode == 'fabric-router' and
        (evpn_fabric_router_address | default('') | length > 0) and
        ((evpn.fabric_router.asn | int) > 0)
      }}
    evpn_external_ready: >-
      {{
        evpn.fabric_mode == 'external' and
        (evpn.fabric_confirmed | bool) and
        ((evpn.peers.sw1 | default('') | string | length) > 0) and
        ((evpn.peers.c1 | default('') | string | length) > 0) and
        ((evpn.peer_asn | int) > 0)
      }}

- name: Publish effective EVPN fabric readiness
  ansible.builtin.set_fact:
    evpn_fabric_ready: >-
      {{ (evpn_self_managed_ready | bool) or
         (evpn_fabric_router_ready | bool) or
         (evpn_external_ready | bool) }}

- name: Create local directory for generated EVPN secrets
  ansible.builtin.file:
    path: artifacts/secrets
    state: directory
    mode: '0700'
  when:
    - evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']
    - evpn.bgp_auth.enabled | bool

- name: Generate or reuse legacy self-managed EVPN BGP password
  ansible.builtin.set_fact:
    evpn_bgp_password: >-
      {{ lookup('ansible.builtin.password',
          'artifacts/secrets/evpn-bgp-password',
          length=32,
          chars=['ascii_letters', 'digits']) }}
  no_log: true
  when:
    - evpn.fabric_mode == 'self-managed-vxlan'
    - evpn.bgp_auth.enabled | bool

- name: Read generated fabric-router BGP password for auto-provisioned fabric
  ansible.builtin.set_fact:
    evpn_bgp_password: >-
      {{ lookup('ansible.builtin.password',
          'artifacts/secrets/evpn-fabric-router-password',
          length=32,
          chars=['ascii_letters', 'digits']) }}
  no_log: true
  when:
    - evpn.fabric_mode == 'fabric-router'
    - evpn.fabric_router.auto_provision | bool
    - evpn.bgp_auth.enabled | bool

- name: Use supplied fabric-router BGP password for externally managed fabric router
  ansible.builtin.set_fact:
    evpn_bgp_password: "{{ evpn.fabric_router.password }}"
  no_log: true
  when:
    - evpn.fabric_mode == 'fabric-router'
    - not (evpn.fabric_router.auto_provision | bool)
    - evpn.bgp_auth.enabled | bool

- name: Publish empty BGP password when authentication is disabled
  ansible.builtin.set_fact:
    evpn_bgp_password: ''
  when:
    - evpn.fabric_mode in ['fabric-router', 'self-managed-vxlan']
    - not (evpn.bgp_auth.enabled | bool)

- name: Require a complete EVPN fabric when requested
  ansible.builtin.assert:
    that:
      - evpn_fabric_ready | bool
    fail_msg: >-
      EVPN platform support is enabled, but {{ evpn.fabric_mode }} is not ready.
      For fabric-router mode either set EVPN_FR_AUTO_PROVISION=true or provide
      EVPN_FR_ADDRESS (and EVPN_FR_BGP_PASSWORD when authentication is enabled).
      For external mode set EVPN_FABRIC_CONFIRMED=true plus peer addresses/ASN.
  when: evpn.fabric_required | default(false) | bool

- name: Clean diagnostic and legacy EVPN state before fabric-router reconciliation
  ansible.builtin.include_tasks: cleanup_legacy.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when:
    - evpn.fabric_mode == 'fabric-router'
    - evpn_fabric_router_ready | bool

- name: Enable OpenShift EVPN platform prerequisites on each managed cluster
  ansible.builtin.include_tasks: platform.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when: evpn.platform_apply | default(true) | bool

- name: Build the legacy cross-site routed transit used as the lab EVPN underlay
  ansible.builtin.include_tasks: transit.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when:
    - evpn.fabric_mode == 'self-managed-vxlan'
    - evpn_self_managed_ready | bool

# Configure both sites before either verification loop so fresh deployments do
# not deadlock waiting for a peer that has not been created yet.
- name: Configure base EVPN BGP peers on both managed clusters
  ansible.builtin.include_tasks: peer.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when: evpn_fabric_ready | bool

- name: Verify base BGP peering after all peers exist
  ansible.builtin.include_tasks: peer_verify.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when: evpn_fabric_ready | bool

- name: Create EVPN CUDN and route advertisements on both clusters
  ansible.builtin.include_tasks: network.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when: evpn_fabric_ready | bool

- name: Verify EVPN address family and remote VTEP reachability
  ansible.builtin.include_tasks: verify.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
  when: evpn_fabric_ready | bool
