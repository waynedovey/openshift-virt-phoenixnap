---
- name: Set per-site facts
  ansible.builtin.set_fact:
    site_key: "{{ site_item.key }}"
    site: "{{ site_item.value }}"
    site_ocp_imageset_name: "{{ rhacm_imageset_by_site[site_item.key] | default('') }}"
    site_existing_aci: "{{ rhacm_existing_aci_exists_by_site[site_item.key] | default(false) | bool }}"

- name: Create cluster namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ site.cluster_name }}"

- name: Create pull secret in cluster namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: assisted-pull-secret
        namespace: "{{ site.cluster_name }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ lab_pull_secret }}"
  no_log: true

- name: Create ManagedCluster
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        name: "{{ site.cluster_name }}"
        labels:
          cloud: phoenixnap
          region: "{{ site.location | lower }}"
          site: "{{ site_key }}"
      spec:
        hubAcceptsClient: true

- name: Create KlusterletAddonConfig
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: agent.open-cluster-management.io/v1
      kind: KlusterletAddonConfig
      metadata:
        name: "{{ site.cluster_name }}"
        namespace: "{{ site.cluster_name }}"
      spec:
        clusterName: "{{ site.cluster_name }}"
        clusterNamespace: "{{ site.cluster_name }}"
        clusterLabels:
          cloud: phoenixnap
          site: "{{ site_key }}"
        applicationManager:
          enabled: true
        certPolicyController:
          enabled: true
        policyController:
          enabled: true
        searchCollector:
          enabled: true

- name: Read existing ClusterDeployment state
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: hive.openshift.io/v1
    kind: ClusterDeployment
    name: "{{ site.cluster_name }}"
    namespace: "{{ site.cluster_name }}"
  register: existing_cluster_deployment

- name: Preserve ClusterDeployment installed state on reruns
  ansible.builtin.set_fact:
    cluster_deployment_installed: >-
      {{
        (existing_cluster_deployment.resources[0].spec.installed | default(false))
        if (existing_cluster_deployment.resources | length > 0)
        else false
      }}

- name: Create or reconcile ClusterDeployment without reverting installed clusters
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: hive.openshift.io/v1
      kind: ClusterDeployment
      metadata:
        name: "{{ site.cluster_name }}"
        namespace: "{{ site.cluster_name }}"
      spec:
        baseDomain: "{{ base_domain }}"
        clusterName: "{{ site.cluster_name }}"
        controlPlaneConfig:
          servingCertificates: {}
        # Hive rejects true -> false. Preserve the live value on idempotent reruns;
        # new/uninstalled ClusterDeployments still start with installed=false.
        installed: "{{ cluster_deployment_installed | bool }}"
        clusterInstallRef:
          group: extensions.hive.openshift.io
          kind: AgentClusterInstall
          name: "{{ site.cluster_name }}"
          version: v1beta1
        platform:
          agentBareMetal:
            agentSelector:
              matchLabels:
                cluster-name: "{{ site.cluster_name }}"
        pullSecretRef:
          name: assisted-pull-secret

- name: Preserve an existing AgentClusterInstall exactly on idempotent reruns
  ansible.builtin.debug:
    msg: >-
      {{ site.cluster_name }} AgentClusterInstall already exists. Its install spec is
      treated as live state and will not be reapplied or backfilled on this rerun.
  when: site_existing_aci | bool

- name: Create AgentClusterInstall only for a genuinely fresh site
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: extensions.hive.openshift.io/v1beta1
      kind: AgentClusterInstall
      metadata:
        name: "{{ site.cluster_name }}"
        namespace: "{{ site.cluster_name }}"
      spec:
        # SNO with Assisted Installer requires userManagedNetworking=true.
        # Current Assisted Service rejects BareMetal + userManagedNetworking=true,
        # so use platform None for provider-neutral PhoenixNAP/iPXE SNO installs.
        platformType: None
        clusterDeploymentRef:
          name: "{{ site.cluster_name }}"
        imageSetRef:
          name: "{{ site_ocp_imageset_name }}"
        networking:
          clusterNetwork:
            - cidr: "{{ site.cluster_network }}"
              hostPrefix: "{{ site.host_prefix }}"
          serviceNetwork:
            - "{{ site.service_network }}"
          userManagedNetworking: true
        provisionRequirements:
          controlPlaneAgents: 1
          workerAgents: 0
        sshPublicKey: "{{ lab_ssh_public_key }}"
  when: not (site_existing_aci | bool)

- name: Verify AgentClusterInstall exists after creation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: extensions.hive.openshift.io/v1beta1
    kind: AgentClusterInstall
    name: "{{ site.cluster_name }}"
    namespace: "{{ site.cluster_name }}"
  register: aci_verify

- name: Require AgentClusterInstall before creating InfraEnv
  ansible.builtin.assert:
    that:
      - aci_verify.resources | length == 1
    fail_msg: >-
      AgentClusterInstall {{ site.cluster_name }} was not created.
      Check ClusterDeployment {{ site.cluster_name }} and the Hive/Assisted admission webhooks
      before waiting for InfraEnv boot artifacts.

- name: Create InfraEnv
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: InfraEnv
      metadata:
        name: "{{ site.cluster_name }}"
        namespace: "{{ site.cluster_name }}"
      spec:
        clusterRef:
          name: "{{ site.cluster_name }}"
          namespace: "{{ site.cluster_name }}"
        pullSecretRef:
          name: assisted-pull-secret
        sshAuthorizedKey: "{{ lab_ssh_public_key }}"
        cpuArchitecture: x86_64
        ipxeScriptType: "{{ rhacm.infraenv_ipxe_script_type }}"
        additionalNTPSources: "{{ rhacm.additional_ntp_sources }}"
        agentLabels:
          cluster-name: "{{ site.cluster_name }}"

- name: Append direct RHCOS rootfs URL to discovery kernel arguments
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: patched
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: InfraEnv
      metadata:
        name: "{{ site.cluster_name }}"
        namespace: "{{ site.cluster_name }}"
      spec:
        kernelArguments:
          - operation: append
            value: "coreos.live.rootfs_url={{ rhacm_rootfs_url }}"
  when: rhacm.direct_rootfs.enabled | bool

- name: Wait for RHACM iPXE boot artifact
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: InfraEnv
    name: "{{ site.cluster_name }}"
    namespace: "{{ site.cluster_name }}"
  register: infraenv_info
  until:
    - infraenv_info.resources | length == 1
    - infraenv_info.resources[0].status is defined
    - infraenv_info.resources[0].status.bootArtifacts is defined
    - infraenv_info.resources[0].status.bootArtifacts.ipxeScript is defined
    - infraenv_info.resources[0].status.bootArtifacts.ipxeScript | length > 0
  retries: 60
  delay: 10
