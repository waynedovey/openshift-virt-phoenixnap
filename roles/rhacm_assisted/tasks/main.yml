---
- name: Read SSH public key
  ansible.builtin.set_fact:
    lab_ssh_public_key: "{{ lookup('file', ssh_public_key.path) | trim }}"

- name: Read Red Hat pull secret
  ansible.builtin.set_fact:
    lab_pull_secret: "{{ lookup('file', openshift_pull_secret_file) | trim }}"
  no_log: true

# Idempotent reruns must not depend on the current ClusterImageSet inventory.
# An existing AgentClusterInstall is authoritative install state, even if its
# current API representation no longer exposes spec.imageSetRef. Existing ACI
# objects are preserved in place and only genuinely missing ACI objects require
# a ClusterImageSet selection.
- name: Read existing AgentClusterInstall state for every site through raw REST
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - get
      - --raw
      - "/apis/extensions.hive.openshift.io/v1beta1/namespaces/{{ item.value.cluster_name }}/agentclusterinstalls/{{ item.value.cluster_name }}"
  register: existing_aci_raw_queries
  changed_when: false
  failed_when: false
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value.cluster_name }}"

- name: Initialize existing AgentClusterInstall state maps
  ansible.builtin.set_fact:
    rhacm_existing_aci_by_site: {}
    rhacm_existing_aci_exists_by_site: {}
    rhacm_existing_imageset_by_site: {}

- name: Parse existing AgentClusterInstall responses defensively
  ansible.builtin.set_fact:
    rhacm_existing_aci_by_site: >-
      {{ rhacm_existing_aci_by_site
         | combine({
             item.item.key:
             (((item.stdout | default('{}', true)) | from_json)
              if ((item.rc | default(1) | int) == 0 and
                  (item.stdout | default('') | trim | length > 0))
              else {})
           }) }}
    rhacm_existing_aci_exists_by_site: >-
      {{ rhacm_existing_aci_exists_by_site
         | combine({
             item.item.key:
             (((item.rc | default(1) | int) == 0) and
              ((item.stdout | default('') | trim | length) > 0) and
              ((((item.stdout | default('{}', true)) | from_json).get('kind', '')) == 'AgentClusterInstall'))
           }) }}
  loop: "{{ existing_aci_raw_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"

- name: Preserve imageSetRef when the existing AgentClusterInstall still exposes it
  ansible.builtin.set_fact:
    rhacm_existing_imageset_by_site: >-
      {{ rhacm_existing_imageset_by_site
         | combine({
             item.key:
             item.value.get('spec', {}).get('imageSetRef', {}).get('name', '')
           }) }}
  loop: "{{ rhacm_existing_aci_by_site | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool
    - item.value.get('spec', {}).get('imageSetRef', {}).get('name', '') | length > 0

- name: Initialize list of sites that genuinely require a new AgentClusterInstall
  ansible.builtin.set_fact:
    rhacm_sites_requiring_new_aci: []

- name: Record sites that genuinely require a new AgentClusterInstall
  ansible.builtin.set_fact:
    rhacm_sites_requiring_new_aci: "{{ rhacm_sites_requiring_new_aci + [item.key] }}"
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool)

- name: Build list of known image sets from existing cluster install state
  ansible.builtin.set_fact:
    rhacm_known_existing_imagesets: >-
      {{ rhacm_existing_imageset_by_site.values()
         | reject('equalto', '')
         | unique
         | list }}

- name: Read optional explicit ClusterImageSet override
  ansible.builtin.set_fact:
    rhacm_imageset_override: >-
      {{ lookup('env', 'OPENSHIFT_CLUSTER_IMAGE_SET') | default('', true) | trim }}

- name: Prefer explicit or already-bound image set for any fresh site
  ansible.builtin.set_fact:
    ocp_default_imageset_name: >-
      {{ rhacm_imageset_override
         if (rhacm_imageset_override | length > 0)
         else ((rhacm_known_existing_imagesets | first) | default('')) }}

- name: Report existing AgentClusterInstall preservation
  ansible.builtin.debug:
    msg: >-
      {{ item.key | upper }}: existing AgentClusterInstall is present and will be
      preserved without reapplying install-spec fields.
      {{ ('Existing imageSetRef=' ~ rhacm_existing_imageset_by_site[item.key] ~ '.')
         if (rhacm_existing_imageset_by_site[item.key] | default('') | length > 0)
         else 'The live object does not expose imageSetRef; this is accepted on an idempotent rerun and does not trigger ClusterImageSet catalog discovery.' }}
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool

# Only sites with no AgentClusterInstall need a ClusterImageSet. A rerun where
# all ACI objects already exist must not fail because the hub no longer serves
# the ClusterImageSet collection.
- name: Query ClusterImageSets through the raw Hive REST endpoint only for fresh sites
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - get
      - --raw
      - /apis/hive.openshift.io/v1/clusterimagesets
  register: image_sets_raw
  changed_when: false
  failed_when: false
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Require ClusterImageSet REST endpoint only when a fresh site needs an ACI
  ansible.builtin.assert:
    that:
      - image_sets_raw.rc | int == 0
      - image_sets_raw.stdout | default('') | trim | length > 0
    fail_msg: >-
      A fresh site ({{ rhacm_sites_requiring_new_aci | join(', ') }}) has no
      AgentClusterInstall and no reusable imageSetRef, but the hub did not serve
      /apis/hive.openshift.io/v1/clusterimagesets. Set OPENSHIFT_CLUSTER_IMAGE_SET
      to a known-good OpenShift {{ ocp_minor }} ClusterImageSet or repair the
      Hive/MCE ClusterImageSet API before creating the missing site.
      rc={{ image_sets_raw.rc | default('unknown') }};
      error={{ image_sets_raw.stderr | default('') | trim | regex_replace('Bearer [^ ]+', 'Bearer [REDACTED]') }}.
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Parse ClusterImageSets returned by the raw Hive REST endpoint
  ansible.builtin.set_fact:
    image_sets_json: "{{ image_sets_raw.stdout | from_json }}"
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Find OpenShift 4.22 ClusterImageSet candidates for fresh sites
  ansible.builtin.set_fact:
    ocp_imageset_candidates: >-
      {{ image_sets_json['items'] | default([])
         | selectattr('metadata.name', 'search', '4[.-]22')
         | list }}
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Build deterministic OpenShift 4.22 ClusterImageSet manifest for a fresh hub
  ansible.builtin.set_fact:
    auto_clusterimageset_manifest: |
      apiVersion: hive.openshift.io/v1
      kind: ClusterImageSet
      metadata:
        name: openshift-{{ ocp_minor }}.0-auto
        labels:
          visible: "true"
          digitaldovey.net/managed-by: phoenixnap-ocp422-evpn
      spec:
        releaseImage: {{ rhacm.release_image }}
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0
    - rhacm.auto_create_clusterimageset | default(true) | bool
    - ocp_imageset_candidates | default([]) | length == 0

- name: Create deterministic ClusterImageSet through raw Hive REST endpoint when absent
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - create
      - --raw=/apis/hive.openshift.io/v1/clusterimagesets
      - -f
      - -
    stdin: "{{ auto_clusterimageset_manifest }}"
  register: clusterimageset_create_raw
  changed_when: clusterimageset_create_raw.rc | int == 0
  failed_when: false
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0
    - rhacm.auto_create_clusterimageset | default(true) | bool
    - ocp_imageset_candidates | default([]) | length == 0

- name: Re-query ClusterImageSets through raw REST after optional self-heal
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - get
      - --raw
      - /apis/hive.openshift.io/v1/clusterimagesets
  register: image_sets_after_reconcile_raw
  changed_when: false
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Parse reconciled ClusterImageSets
  ansible.builtin.set_fact:
    image_sets_after_reconcile_json: "{{ image_sets_after_reconcile_raw.stdout | from_json }}"
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Rebuild OpenShift 4.22 ClusterImageSet candidates
  ansible.builtin.set_fact:
    ocp_imageset_candidates: >-
      {{ image_sets_after_reconcile_json['items'] | default([])
         | selectattr('metadata.name', 'search', '4[.-]22')
         | list }}
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Require OpenShift 4.22 ClusterImageSet only for fresh sites
  ansible.builtin.assert:
    that:
      - ocp_imageset_candidates | default([]) | length > 0
    fail_msg: >-
      No ClusterImageSet matching OpenShift {{ ocp_minor }} was found for the
      fresh site(s) {{ rhacm_sites_requiring_new_aci | join(', ') }} and automatic
      creation did not produce one. Set OPENSHIFT_CLUSTER_IMAGE_SET explicitly.
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Select most recently created OpenShift 4.22 ClusterImageSet for fresh sites
  ansible.builtin.set_fact:
    ocp_default_imageset_name: >-
      {{ (ocp_imageset_candidates
          | sort(attribute='metadata.creationTimestamp')
          | last).metadata.name }}
  when:
    - rhacm_sites_requiring_new_aci | length > 0
    - ocp_default_imageset_name | length == 0

- name: Initialize effective per-site ClusterImageSet map
  ansible.builtin.set_fact:
    rhacm_imageset_by_site: {}

- name: Build effective per-site ClusterImageSet map
  ansible.builtin.set_fact:
    rhacm_imageset_by_site: >-
      {{ rhacm_imageset_by_site
         | combine({
             item.key:
             (rhacm_existing_imageset_by_site[item.key]
              if (rhacm_existing_imageset_by_site[item.key] | default('') | length > 0)
              else (''
                    if (rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool)
                    else ocp_default_imageset_name))
           }) }}
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require an effective ClusterImageSet reference only for fresh sites
  ansible.builtin.assert:
    that:
      - rhacm_imageset_by_site[item.key] | default('') | length > 0
    fail_msg: >-
      No effective ClusterImageSet could be determined for fresh site {{ item.key }}.
      Set OPENSHIFT_CLUSTER_IMAGE_SET explicitly or restore the Hive ClusterImageSet API.
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool)

- name: Report effective OpenShift release image-set decision per site
  ansible.builtin.debug:
    msg: >-
      {{ item.key | upper }}: {{
        (('preserving existing AgentClusterInstall with imageSetRef=' ~ rhacm_imageset_by_site[item.key] ~ '.')
         if (rhacm_imageset_by_site[item.key] | default('') | length > 0)
         else 'preserving existing AgentClusterInstall exactly as-is; no imageSetRef/catalog dependency on this rerun.')
        if (rhacm_existing_aci_exists_by_site[item.key] | default(false) | bool)
        else ('fresh AgentClusterInstall will use ClusterImageSet ' ~ rhacm_imageset_by_site[item.key] ~ '.')
      }}
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Optionally expose iPXE artifacts over HTTP on the hub
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: AgentServiceConfig
      metadata:
        name: agent
      spec:
        iPXEHTTPRoute: enabled
  when: rhacm.enable_http_ipxe_route | bool

- name: Read AgentServiceConfig for the direct RHCOS rootfs source
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: AgentServiceConfig
    name: agent
  register: agent_service_config
  when: rhacm.direct_rootfs.enabled | bool

- name: Require AgentServiceConfig before selecting the direct rootfs
  ansible.builtin.assert:
    that:
      - agent_service_config.resources | length == 1
    fail_msg: "AgentServiceConfig agent was not found on the RHACM hub."
  when: rhacm.direct_rootfs.enabled | bool

- name: Select the matching RHCOS rootfs URL
  ansible.builtin.set_fact:
    rhacm_rootfs_url: >-
      {{ (agent_service_config.resources[0].spec.osImages
          | selectattr('openshiftVersion', 'equalto', ocp_minor)
          | selectattr('cpuArchitecture', 'equalto', 'x86_64')
          | selectattr('rootFSUrl', 'defined')
          | rejectattr('rootFSUrl', 'equalto', '')
          | map(attribute='rootFSUrl')
          | list
          | first) | default('') }}
  when: rhacm.direct_rootfs.enabled | bool

- name: Require a direct RHCOS rootfs URL
  ansible.builtin.assert:
    that:
      - rhacm_rootfs_url | length > 0
      - rhacm_rootfs_url is match('^https?://')
    fail_msg: >-
      AgentServiceConfig agent does not contain a non-empty x86_64 OpenShift
      {{ ocp_minor }} rootFSUrl. The PhoenixNAP iPXE flow cannot bypass the
      hub ingress rootfs stream until spec.osImages[].rootFSUrl is populated.
  when: rhacm.direct_rootfs.enabled | bool

- name: Report direct rootfs bypass
  ansible.builtin.debug:
    msg: >-
      Discovery iPXE will append coreos.live.rootfs_url={{ rhacm_rootfs_url }}
      so the large RHCOS rootfs bypasses the RHACM ingress route.
  when: rhacm.direct_rootfs.enabled | bool

- name: Create Host Inventory resources for each site
  ansible.builtin.include_tasks: site.yml
  loop: "{{ sites | dict2items }}"
  loop_control:
    loop_var: site_item
