---
- name: Find existing {{ site_item.key }} private L2 network
  ansible.builtin.set_fact:
    existing_private_network: >-
      {{ (pnap_private_networks_existing.json
          | selectattr('name', 'equalto', site_item.value.private_l2.name)
          | selectattr('location', 'equalto', site_item.value.location)
          | list | first) | default({}) }}

- name: Validate an existing private network matches the requested CIDR
  ansible.builtin.assert:
    that:
      - existing_private_network.cidr | default(site_item.value.private_l2.cidr) == site_item.value.private_l2.cidr
    fail_msg: >-
      Existing private network {{ site_item.value.private_l2.name }} in
      {{ site_item.value.location }} has CIDR {{ existing_private_network.cidr | default('unknown') }},
      expected {{ site_item.value.private_l2.cidr }}.
  when: existing_private_network | length > 0

- name: Create {{ site_item.key }} private Layer2 network
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks"
    method: POST
    headers:
      Authorization: "Bearer {{ pnap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ site_item.value.private_l2.name }}"
      description: "{{ project_name }} OpenShift Virtualization site-local L2 - {{ site_item.key }}"
      location: "{{ site_item.value.location }}"
      locationDefault: false
      cidr: "{{ site_item.value.private_l2.cidr }}"
    return_content: true
    status_code: [200, 201, 202]
  register: private_network_create
  when: existing_private_network | length == 0
  no_log: true

- name: Determine private network ID
  ansible.builtin.set_fact:
    private_network_id: >-
      {{ existing_private_network.id
         if existing_private_network | length > 0
         else private_network_create.json.id }}

- name: Wait for private network VLAN allocation
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks/{{ private_network_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: private_network_info
  until:
    - private_network_info.json.id | default('') | length > 0
    - private_network_info.json.vlanId is defined
    - private_network_info.json.status | default('READY') == 'READY'
  retries: "{{ (wait.network_seconds / 10) | int }}"
  delay: 10
  no_log: true

- name: Create local private-network state directory
  ansible.builtin.file:
    path: artifacts/networks
    state: directory
    mode: '0700'

- name: Save site-local private network state
  ansible.builtin.copy:
    dest: "artifacts/networks/{{ site_item.key }}.yml"
    mode: '0600'
    content: |
      network_id: {{ private_network_info.json.id }}
      name: {{ private_network_info.json.name }}
      location: {{ private_network_info.json.location }}
      cidr: {{ private_network_info.json.cidr | default(site_item.value.private_l2.cidr) }}
      vlan_id: {{ private_network_info.json.vlanId }}

- name: Report private Layer2 network
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} private L2: {{ private_network_info.json.name }}
      CIDR={{ private_network_info.json.cidr | default(site_item.value.private_l2.cidr) }}
      VLAN={{ private_network_info.json.vlanId }}
