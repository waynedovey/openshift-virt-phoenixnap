---
- name: Require phoenixNAP OAuth credentials
  ansible.builtin.assert:
    that:
      - lookup('env', 'PNAP_CLIENT_ID') | length > 0
      - lookup('env', 'PNAP_CLIENT_SECRET') | length > 0
    fail_msg: "PNAP_CLIENT_ID and PNAP_CLIENT_SECRET are required."

- name: Refresh phoenixNAP OAuth token
  ansible.builtin.include_tasks: refresh.yml
