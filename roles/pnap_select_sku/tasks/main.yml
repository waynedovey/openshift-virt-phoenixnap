---
# Capacity checks must be idempotent. A live-stock query is only relevant when
# this run actually needs to create a server. Once a lab server already exists,
# its SKU may legitimately show zero remaining provider inventory because this
# deployment consumed the last unit.
- name: List existing phoenixNAP servers before capacity selection
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: pnap_existing_servers_for_capacity
  no_log: true

- name: Initialize idempotent phoenixNAP capacity state
  ansible.builtin.set_fact:
    pnap_existing_servers_by_site: {}
    pnap_existing_server_reuse_rows: {}
    pnap_existing_storage_info_by_site: {}
    pnap_sites_needing_capacity: []
    pnap_selector_site_argv: []
    pnap_forced_capacity_sites: >-
      {{ pnap_force_capacity_sites
         | default((sites.keys() | list)
         if (pnap_force_capacity_selection | default(false) | bool) else []) }}

- name: Map configured sites to existing phoenixNAP servers
  ansible.builtin.set_fact:
    pnap_existing_servers_by_site: >-
      {{ pnap_existing_servers_by_site | combine({
        item.key: (
          pnap_existing_servers_for_capacity.json | default([])
          | selectattr('hostname', 'equalto', item.value.node_hostname)
          | list | first | default({})
        )
      }) }}
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value.node_hostname }}"

- name: Require an existing hostname to remain in its configured physical site
  ansible.builtin.assert:
    that:
      - >-
        (pnap_existing_servers_by_site[item.key] | length == 0)
        or ((pnap_existing_servers_by_site[item.key].location | default(item.value.location)) == item.value.location)
    fail_msg: >-
      Existing {{ item.value.node_hostname }} is in phoenixNAP location
      {{ pnap_existing_servers_by_site[item.key].location | default('unknown') }}, but the lab now requests
      {{ item.value.location }}. A server cannot move regions in place. Use `make destroy` for a full topology
      change or explicitly reconcile the server before rerunning deploy.
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}@{{ item.value.location }}"
  when: item.key not in pnap_forced_capacity_sites

- name: Parse physical storage count for reusable existing servers
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/../../scripts/pnap_storage_devices.py"
      - --storage
      - "{{ pnap_existing_servers_by_site[item.key].storage | default('') }}"
  register: pnap_existing_storage_probe
  changed_when: false
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ pnap_existing_servers_by_site[item.key].type | default('unknown') }}"
  when:
    - lvm_storage.enabled | default(false) | bool
    - phoenixnap.auto_select.min_storage_devices | default(1) | int > 1
    - item.key not in pnap_forced_capacity_sites
    - pnap_existing_servers_by_site[item.key] | length > 0

- name: Build existing-server storage inventory map
  ansible.builtin.set_fact:
    pnap_existing_storage_info_by_site: >-
      {{ pnap_existing_storage_info_by_site | combine({
        item.item.key: (item.stdout | from_json)
      }) }}
  loop: "{{ pnap_existing_storage_probe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"
  when:
    - item.stdout is defined
    - item.item is defined

- name: Require reusable existing servers to satisfy LVMS disk-count policy
  ansible.builtin.assert:
    that:
      - >-
        (pnap_existing_storage_info_by_site.get(item.key, {}).get('storageDeviceCount', 0) | int)
        >= (phoenixnap.auto_select.min_storage_devices | int)
    fail_msg: >-
      Existing {{ item.value.node_hostname }} ({{ pnap_existing_servers_by_site[item.key].type | default('unknown') }})
      reports storage='{{ pnap_existing_servers_by_site[item.key].storage | default('unknown') }}', parsed as
      {{ pnap_existing_storage_info_by_site.get(item.key, {}).get('storageDeviceCount', 0) }} physical device(s).
      This lab has LVMS enabled and requires at least {{ phoenixnap.auto_select.min_storage_devices }} devices:
      one installation disk plus one dedicated empty LVMS disk. The existing server will not be reused.
      Run `make replace-site SITE={{ item.key }}` to replace only this site with a qualifying two-disk SKU.
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value.node_hostname }}"
  when:
    - lvm_storage.enabled | default(false) | bool
    - phoenixnap.auto_select.min_storage_devices | default(1) | int > 1
    - item.key not in pnap_forced_capacity_sites
    - pnap_existing_servers_by_site[item.key] | length > 0

- name: Build reusable existing-server SKU rows
  ansible.builtin.set_fact:
    pnap_existing_server_reuse_rows: >-
      {{ pnap_existing_server_reuse_rows | combine({
        item.key: {
          'productCode': pnap_existing_servers_by_site[item.key].type | default('unknown'),
          'location': pnap_existing_servers_by_site[item.key].location | default(item.value.location),
          'hostname': item.value.node_hostname,
          'serverId': pnap_existing_servers_by_site[item.key].id | default(''),
          'status': pnap_existing_servers_by_site[item.key].status | default('unknown'),
          'storage': pnap_existing_servers_by_site[item.key].storage | default(''),
          'storageDeviceCount': pnap_existing_storage_info_by_site.get(item.key, {}).get('storageDeviceCount', 0),
          'reusedExisting': true
        }
      }) }}
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value.node_hostname }}"
  when:
    - item.key not in pnap_forced_capacity_sites
    - pnap_existing_servers_by_site[item.key] | length > 0

- name: Determine which sites actually need new phoenixNAP capacity
  ansible.builtin.set_fact:
    pnap_sites_needing_capacity: "{{ pnap_sites_needing_capacity + [item.key] }}"
  loop: "{{ sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    (item.key in pnap_forced_capacity_sites)
    or (pnap_existing_servers_by_site[item.key] | length == 0)

- name: Report existing servers excluded from live-stock gating
  ansible.builtin.debug:
    msg: >-
      {{ item.key | upper }}: reusing existing {{ item.value.hostname }}
      type={{ item.value.productCode }}, location={{ item.value.location }}, status={{ item.value.status }}.
      Live SKU stock is intentionally not required for this site on an idempotent rerun.
  loop: "{{ pnap_existing_server_reuse_rows | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - phoenixnap.auto_select.enabled | bool

- name: Build selector site arguments only for sites that need a new server
  ansible.builtin.set_fact:
    pnap_selector_site_argv: >-
      {{ pnap_selector_site_argv + ['--site', item ~ '=' ~ sites[item].location] }}
  loop: "{{ pnap_sites_needing_capacity }}"
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length > 0

- name: Build phoenixNAP dynamic SKU selector command
  ansible.builtin.set_fact:
    pnap_selector_argv: >-
      {{
        [
          ansible_playbook_python,
          role_path ~ '/../../scripts/select_pnap_sku.py',
          '--api-base', phoenixnap.api_base
        ]
        + pnap_selector_site_argv
        + [
          '--max-hourly-price', phoenixnap.auto_select.max_hourly_price | string,
          '--min-ram-gb', phoenixnap.auto_select.min_ram_gb | string,
          '--min-cores', phoenixnap.auto_select.min_cores | string,
          '--min-storage-devices', phoenixnap.auto_select.min_storage_devices | default(1) | string,
          '--preferred-ram-gb', phoenixnap.auto_select.preferred_ram_gb | string,
          '--preferred-cores', phoenixnap.auto_select.preferred_cores | string,
          '--top', phoenixnap.auto_select.show_top_candidates | string
        ]
        + (['--prefer-common'] if (phoenixnap.auto_select.prefer_common_sku | bool and pnap_sites_needing_capacity | length > 1) else [])
        + (['--require-common'] if (phoenixnap.auto_select.require_common_sku | bool and pnap_sites_needing_capacity | length > 1) else [])
      }}
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length > 0

- name: Select live phoenixNAP SKUs only for missing servers
  ansible.builtin.command:
    argv: "{{ pnap_selector_argv }}"
  environment:
    PNAP_ACCESS_TOKEN: "{{ pnap_token }}"
  register: pnap_selector_raw
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length > 0

- name: Parse sanitized phoenixNAP SKU selection
  ansible.builtin.set_fact:
    pnap_sku_selection: "{{ pnap_selector_raw.stdout | from_json }}"
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length > 0

- name: Publish no-capacity-required selection state
  ansible.builtin.set_fact:
    pnap_sku_selection:
      ok: true
      commonSkuSelected: false
      sites: {}
      candidates: {}
      existingSites: "{{ pnap_existing_server_reuse_rows.keys() | list }}"
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length == 0

- name: Require live capacity selection to succeed when a server is actually missing
  ansible.builtin.assert:
    that:
      - pnap_sku_selection.ok | bool
    fail_msg: "{{ pnap_sku_selection.error | default('No phoenixNAP SKU satisfied the configured budget/sizing policy.') }}"
  when:
    - phoenixnap.auto_select.enabled | bool
    - pnap_sites_needing_capacity | length > 0

- name: Require a selected SKU for every site that needs new capacity
  ansible.builtin.assert:
    that:
      - item in (pnap_sku_selection.sites | default({}))
      - pnap_sku_selection.sites[item].productCode | default('') | length > 0
    fail_msg: >-
      phoenixNAP dynamic selection did not return a safe SKU for {{ item }} even though that site
      requires a new server.
  loop: "{{ pnap_sites_needing_capacity }}"
  loop_control:
    label: "{{ item }}"
  when: phoenixnap.auto_select.enabled | bool

- name: Publish effective selected or reused SKUs
  ansible.builtin.set_fact:
    pnap_selected_skus: >-
      {{ (pnap_sku_selection.sites | default({}))
         | combine(pnap_existing_server_reuse_rows | default({}), recursive=true) }}
  when: phoenixnap.auto_select.enabled | bool

- name: Report dynamically selected shapes for sites requiring new servers
  ansible.builtin.debug:
    msg: >-
      {{ item | upper }}: selected {{ pnap_selected_skus[item].productCode }} @
      ${{ '%.3f' | format(pnap_selected_skus[item].hourlyPrice | float) }}/h in {{ sites[item].location }}
      ({{ pnap_selected_skus[item].ramInGb }}GB/{{ pnap_selected_skus[item].cores }} cores,
      disks={{ pnap_selected_skus[item].storageDeviceCount | default('?') }},
      storage={{ pnap_selected_skus[item].storage | default('unknown') }},
      stock={{ pnap_selected_skus[item].availableQuantity }}).
  loop: "{{ pnap_sites_needing_capacity }}"
  loop_control:
    label: "{{ item }}"
  when: phoenixnap.auto_select.enabled | bool
