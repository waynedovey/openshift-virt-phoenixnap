---
- name: Set EVPN proof VM site facts
  ansible.builtin.set_fact:
    managed_kubeconfig: "artifacts/kubeconfigs/{{ site_item.value.cluster_name }}.kubeconfig"
    evpn_test_vm_name: "rhel9-{{ site_item.key }}"
    evpn_test_vm_rootdisk: "rhel9-{{ site_item.key }}-rootdisk"
    evpn_test_vm_secret: "rhel9-{{ site_item.key }}-authorized-keys"
    evpn_test_vm_bootstrap_revision: "{{ evpn_test_vms.bootstrap_revision | string }}"
    evpn_test_vm_ip_cidr: "{{ evpn_test_vms.ips[site_item.key] }}"
    evpn_test_vm_ip: "{{ evpn_test_vms.ips[site_item.key].split('/')[0] }}"
    evpn_test_vm_mac: "{{ evpn_test_vms.macs[site_item.key] }}"
    evpn_test_vm_peer_ip: >-
      {{ evpn_test_vms.ips['c1' if site_item.key == 'sw1' else 'sw1'].split('/')[0] }}
    evpn_test_site_addressing: "{{ evpn.addressing[site_item.key] }}"

- name: Require shared EVPN network and LVM storage before creating test VM
  ansible.builtin.assert:
    that:
      - evpn_test_vm_ip_cidr | length > 0
      - evpn_test_vm_mac | length > 0
      - evpn_test_vms.storage_class == ('lvms-' ~ lvm_storage.device_class)
    fail_msg: "Review evpn_test_vms configuration in inventories/lab/group_vars/all.yml."

- name: Verify EVPN workload namespace has immutable primary-UDN label
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ evpn.namespace }}"
  register: evpn_vm_namespace

- name: Require primary UDN namespace to be ready
  ansible.builtin.assert:
    that:
      - evpn_vm_namespace.resources | length == 1
      - (evpn_vm_namespace.resources[0].metadata.labels | default({})).get('k8s.ovn.org/primary-user-defined-network', '__missing__') == ''
    fail_msg: >-
      {{ evpn.namespace }} must exist with k8s.ovn.org/primary-user-defined-network=""
      from namespace creation time before a single-interface primary-UDN VM can start.

- name: Wait for EVPN ClusterUserDefinedNetwork acceptance
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ evpn.network_name }}"
  register: evpn_test_cudn
  until: >-
    evpn_test_cudn.resources | length == 1 and
    (evpn_test_cudn.resources[0].status.conditions | default([])
      | selectattr('reason', 'equalto', 'EVPNTransportAccepted')
      | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 60
  delay: 10

- name: Require persistent primary-CUDN IPAM layout for deterministic proof VM address
  ansible.builtin.assert:
    that:
      - evpn_test_cudn.resources | length == 1
      - evpn_test_cudn.resources[0].spec.network.layer2.role == 'Primary'
      - evpn_test_cudn.resources[0].spec.network.layer2.subnets == [evpn.vm_subnet]
      - evpn_test_cudn.resources[0].spec.network.layer2.ipam.mode | default('Enabled') == 'Enabled'
      - evpn_test_cudn.resources[0].spec.network.layer2.ipam.lifecycle == 'Persistent'
      - evpn_test_cudn.resources[0].spec.network.layer2.defaultGatewayIPs == [evpn_test_site_addressing.default_gateway]
      - evpn_test_cudn.resources[0].spec.network.layer2.infrastructureSubnets == [evpn_test_site_addressing.infrastructure_subnet]
      - evpn_test_cudn.resources[0].spec.network.layer2.reservedSubnets == evpn_test_site_addressing.reserved_subnets
    fail_msg: >-
      {{ evpn.network_name }} does not match the OpenShift 4.22 primary Layer2 CUDN
      layout required for deterministic persistent IPAM on {{ site_item.key }}. Run
      make evpn before make test-vms.

- name: Wait for LVMS StorageClass
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ evpn_test_vms.storage_class }}"
  register: evpn_vm_sc
  until: evpn_vm_sc.resources | length == 1
  retries: 60
  delay: 5

- name: Wait for Red Hat RHEL 9 boot DataSource
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataSource
    name: "{{ evpn_test_vms.image_datasource }}"
    namespace: "{{ evpn_test_vms.image_namespace }}"
  register: rhel9_datasource
  until: >-
    rhel9_datasource.resources | length == 1 and
    (rhel9_datasource.resources[0].spec.source.pvc is defined or
     rhel9_datasource.resources[0].spec.source.snapshot is defined)
  retries: "{{ (wait.operator_seconds / 15) | int }}"
  delay: 15

- name: Read existing RHEL 9 EVPN proof VM before cloud-init reconciliation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ evpn_test_vm_name }}"
    namespace: "{{ evpn.namespace }}"
  register: evpn_existing_proof_vm

- name: Determine whether proof VM must be recreated for new first-boot configuration
  ansible.builtin.set_fact:
    evpn_test_vm_requires_recreate: >-
      {{
        evpn_existing_proof_vm.resources | length == 1 and
        (
          (evpn_existing_proof_vm.resources[0].metadata.annotations | default({}))
            .get('digitaldovey.net/bootstrap-revision', '0')
        ) != evpn_test_vm_bootstrap_revision
      }}

- name: Report proof VM first-boot recreation
  ansible.builtin.debug:
    msg: >-
      Recreating {{ evpn_test_vm_name }} because its cloud-init/bootstrap revision is
      {{ (evpn_existing_proof_vm.resources[0].metadata.annotations | default({})).get('digitaldovey.net/bootstrap-revision', '0') }}
      and the repository requires {{ evpn_test_vm_bootstrap_revision }}. The EVPN proof
      root disk is disposable; EVPN/CUDN/FRR resources are not changed.
  when: evpn_test_vm_requires_recreate | bool

- name: Delete stale RHEL 9 EVPN proof VM for first-boot recreation
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ evpn_test_vm_name }}"
    namespace: "{{ evpn.namespace }}"
    wait: true
    wait_timeout: 180
  when: evpn_test_vm_requires_recreate | bool

- name: Delete stale RHEL 9 proof root DataVolume so cloud-init starts cleanly
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: absent
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    name: "{{ evpn_test_vm_rootdisk }}"
    namespace: "{{ evpn.namespace }}"
    wait: true
    wait_timeout: 180
  when: evpn_test_vm_requires_recreate | bool

- name: Create SSH key secret for RHEL 9 proof VM
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ evpn_test_vm_secret }}"
        namespace: "{{ evpn.namespace }}"
      type: Opaque
      stringData:
        key: "{{ evpn_test_vm_ssh_key }}"

- name: Create single-interface RHEL 9 EVPN proof VM
  kubernetes.core.k8s:
    kubeconfig: "{{ managed_kubeconfig }}"
    state: present
    definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: "{{ evpn_test_vm_name }}"
        namespace: "{{ evpn.namespace }}"
        annotations:
          digitaldovey.net/bootstrap-revision: "{{ evpn_test_vm_bootstrap_revision }}"
        labels:
          digitaldovey.net/evpn-proof: "true"
          digitaldovey.net/site: "{{ site_item.key }}"
      spec:
        runStrategy: Always
        preference:
          name: rhel.9
        dataVolumeTemplates:
          - metadata:
              name: "{{ evpn_test_vm_rootdisk }}"
            spec:
              sourceRef:
                kind: DataSource
                name: "{{ evpn_test_vms.image_datasource }}"
                namespace: "{{ evpn_test_vms.image_namespace }}"
              storage:
                storageClassName: "{{ evpn_test_vms.storage_class }}"
                accessModes:
                  - ReadWriteOnce
                volumeMode: Block
                resources:
                  requests:
                    storage: "{{ evpn_test_vms.disk_size }}"
        template:
          metadata:
            labels:
              digitaldovey.net/evpn-proof: "true"
              digitaldovey.net/site: "{{ site_item.key }}"
          spec:
            domain:
              # The common RHEL 9 preference uses a socket-oriented CPU topology.
              # Supplying only `cores` is rejected by the KubeVirt preference validator
              # because it sees 0 vCPUs in the preferred sockets dimension.
              cpu:
                sockets: "{{ evpn_test_vms.cpu_cores | int }}"
              memory:
                guest: "{{ evpn_test_vms.memory }}"
              devices:
                interfaces:
                  - name: default
                    macAddress: "{{ evpn_test_vm_mac }}"
                    binding:
                      name: l2bridge
            networks:
              - name: default
                pod: {}
            accessCredentials:
              - sshPublicKey:
                  propagationMethod:
                    noCloud: {}
                  source:
                    secret:
                      secretName: "{{ evpn_test_vm_secret }}"
            volumes:
              - name: rootdisk
                dataVolume:
                  name: "{{ evpn_test_vm_rootdisk }}"
              - name: cloudinitdisk
                cloudInitNoCloud:
                  userData: |
                    #cloud-config
                    # Lab-only credentials. Override the default password with
                    # EVPN_TEST_VM_PASSWORD before running make test-vms.
                    user: {{ evpn_test_vms.console_user }}
                    password: {{ evpn_test_vms.console_password | to_json }}
                    chpasswd: { expire: false }
                    ssh_pwauth: true
                    ssh_authorized_keys:
                      - {{ evpn_test_vm_ssh_key | to_json }}
                    write_files:
                      - path: /usr/local/sbin/evpn-peer-check
                        owner: root:root
                        permissions: '0755'
                        content: |
                          #!/bin/bash
                          while true; do
                            echo "[EVPN-PROOF] $(date -Is) {{ evpn_test_vm_name }} ({{ evpn_test_vm_ip }}) -> {{ evpn_test_vm_peer_ip }}" > /dev/ttyS0
                            ping -c 1 -W 2 {{ evpn_test_vm_peer_ip }} >> /dev/ttyS0 2>&1 || true
                            sleep {{ evpn_test_vms.peer_check_seconds }}
                          done
                      - path: /etc/systemd/system/evpn-peer-check.service
                        owner: root:root
                        permissions: '0644'
                        content: |
                          [Unit]
                          Description=Cross-site EVPN proof ping
                          After=network-online.target
                          Wants=network-online.target

                          [Service]
                          Type=simple
                          ExecStart=/usr/local/sbin/evpn-peer-check
                          Restart=always
                          RestartSec=5

                          [Install]
                          WantedBy=multi-user.target
                    runcmd:
                      - [ systemctl, enable, --now, sshd ]
                      - [ systemctl, daemon-reload ]
                      - [ systemctl, enable, --now, evpn-peer-check.service ]
                  networkData: |
                    version: 2
                    ethernets:
                      evpn0:
                        match:
                          macaddress: "{{ evpn_test_vm_mac }}"
                        set-name: eth0
                        dhcp4: true
                        dhcp6: false

- name: Wait for RHEL 9 root DataVolume import/clone
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    name: "{{ evpn_test_vm_rootdisk }}"
    namespace: "{{ evpn.namespace }}"
  register: evpn_vm_dv
  until:
    - evpn_vm_dv.resources | length == 1
    - evpn_vm_dv.resources[0].status.phase | default('') == 'Succeeded'
  retries: "{{ (wait.operator_seconds / 15) | int }}"
  delay: 15

- name: Wait for RHEL 9 EVPN proof VMI to run
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ evpn_test_vm_name }}"
    namespace: "{{ evpn.namespace }}"
  register: evpn_test_vmi
  until:
    - evpn_test_vmi.resources | length == 1
    - evpn_test_vmi.resources[0].status.phase | default('') == 'Running'
  retries: "{{ (wait.operator_seconds / 10) | int }}"
  delay: 10

- name: Wait for deterministic persistent EVPN IP allocation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ managed_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ evpn_test_vm_name }}"
    namespace: "{{ evpn.namespace }}"
  register: evpn_test_vmi_addressed
  until: >-
    evpn_test_vmi_addressed.resources | length == 1 and
    (evpn_test_vmi_addressed.resources[0].status.interfaces | default([])
      | selectattr('name', 'equalto', 'default')
      | selectattr('ipAddress', 'defined')
      | selectattr('ipAddress', 'equalto', evpn_test_vm_ip)
      | list | length) > 0
  retries: 60
  delay: 5

- name: Report RHEL 9 EVPN proof VM
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }}: {{ evpn_test_vm_name }} is Running with exactly one
      primary l2bridge interface; OVN persistent IP={{ evpn_test_vm_ip_cidr }},
      MAC={{ evpn_test_vm_mac }}, root={{ evpn_test_vms.disk_size }} on
      {{ evpn_test_vms.storage_class }}. The site CUDN allocator has exactly this
      proof address available to workloads, and the guest obtains it with DHCP.
      Its serial console continuously pings peer {{ evpn_test_vm_peer_ip }}.
      Console login user={{ evpn_test_vms.console_user }}; password comes from
      EVPN_TEST_VM_PASSWORD (lab default: redhat). sshd is enabled at first boot.
