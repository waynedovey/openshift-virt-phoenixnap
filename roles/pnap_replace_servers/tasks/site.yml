---
- name: Set desired replacement server type for {{ site_item.key }}
  ansible.builtin.set_fact:
    replace_site_server_type: >-
      {{ pnap_selected_skus[site_item.key].productCode
         if phoenixnap.auto_select.enabled | bool
         else site_item.value.server_type | default(phoenixnap.server_type) }}

- name: Find current {{ site_item.key }} server for replacement
  ansible.builtin.set_fact:
    replace_site_server: >-
      {{ (replace_servers.json
          | selectattr('hostname', 'equalto', site_item.value.node_hostname)
          | list | first) | default({}) }}

- name: Find requested {{ site_item.key }} private Layer2 network
  ansible.builtin.set_fact:
    replace_site_private_network: >-
      {{ (replace_private_networks.json
          | selectattr('name', 'equalto', site_item.value.private_l2.name)
          | selectattr('location', 'equalto', site_item.value.location)
          | list | first) | default({}) }}

- name: Require requested private Layer2 network before replacement
  ansible.builtin.assert:
    that:
      - replace_site_private_network | length > 0
      - replace_site_private_network.id | default('') | length > 0
    fail_msg: >-
      Private L2 network {{ site_item.value.private_l2.name }} is missing in
      {{ site_item.value.location }}. Run `make private-networks` first.

- name: Read current server details
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ replace_site_server.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: replace_site_detail
  when: replace_site_server | length > 0
  no_log: true

- name: Decide whether {{ site_item.key }} requires replacement
  ansible.builtin.set_fact:
    replace_site_required: >-
      {{ replace_site_server | length > 0 and
         (replace_site_server.type != replace_site_server_type or
          (replace_site_detail.json.networkType | default('')) != phoenixnap.network_type or
          (replace_site_detail.json.networkConfiguration.privateNetworkConfiguration.privateNetworks | default([])
           | selectattr('id', 'equalto', replace_site_private_network.id)
           | list | length) != 1) }}

- name: Report matching server replacement
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key | upper }} will be rebuilt: current type={{ replace_site_server.type }},
      storage={{ replace_site_detail.json.storage | default(replace_site_server.storage | default('unknown')) }},
      desired type={{ replace_site_server_type }}. RHACM install state will be removed and verified absent
      before phoenixNAP hardware is deprovisioned.
  when: replace_site_required | bool

# An installed AgentClusterInstall/ClusterDeployment must not survive a hardware replacement.
# Otherwise a later `make deploy` sees spec.installed=true and preserves stale install state instead
# of creating a new Assisted Installer flow. Reset hub-side site state first, and only destroy the
# physical server after the reset is fully confirmed.
- name: Find Host Inventory Agents before site reset
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ site_item.value.cluster_name }}"
  register: replace_agents
  when: replace_site_required | bool

- name: Delete stale Agent objects before site reset
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: absent
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    name: "{{ item.metadata.name }}"
    namespace: "{{ site_item.value.cluster_name }}"
    wait: true
    wait_timeout: 120
  loop: "{{ replace_agents.resources | default([]) }}"
  when: replace_site_required | bool

- name: Start deletion of old RHACM ManagedCluster
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - delete
      - managedclusters.cluster.open-cluster-management.io
      - "{{ site_item.value.cluster_name }}"
      - --ignore-not-found=true
      - --wait=false
  register: replace_managedcluster_delete
  changed_when: "'deleted' in replace_managedcluster_delete.stdout"
  when: replace_site_required | bool

- name: Start deletion of old RHACM site namespace and install state
  ansible.builtin.command:
    argv:
      - oc
      - --kubeconfig
      - "{{ rhacm.kubeconfig }}"
      - delete
      - namespace
      - "{{ site_item.value.cluster_name }}"
      - --ignore-not-found=true
      - --wait=false
  register: replace_namespace_delete
  changed_when: "'deleted' in replace_namespace_delete.stdout"
  when: replace_site_required | bool

- name: Wait for old RHACM site namespace to be fully removed
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ site_item.value.cluster_name }}"
  register: replace_namespace_state
  until: replace_namespace_state.resources | length == 0
  retries: 60
  delay: 5
  when: replace_site_required | bool

- name: Wait for old RHACM ManagedCluster to be fully removed
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ site_item.value.cluster_name }}"
  register: replace_managedcluster_state
  until: replace_managedcluster_state.resources | length == 0
  retries: 60
  delay: 5
  when: replace_site_required | bool

- name: Confirm destructive site reset completed before hardware removal
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key | upper }} RHACM install state is absent. It is now safe to remove
      phoenixNAP server {{ replace_site_server.hostname }}; the next `make deploy` will create
      a fresh ClusterDeployment, AgentClusterInstall, InfraEnv and ManagedCluster.
  when: replace_site_required | bool

- name: Deprovision incompatible hourly server
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ replace_site_server.id }}/actions/deprovision"
    method: POST
    headers:
      Authorization: "Bearer {{ pnap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      deleteIpBlocks: true
    status_code: [200, 202, 404]
  when: replace_site_required | bool
  no_log: true

- name: Wait until incompatible server is removed
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ replace_site_server.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    status_code: [200, 404]
    return_content: false
  register: replace_site_gone
  until: replace_site_gone.status == 404
  retries: 90
  delay: 10
  when: replace_site_required | bool
  no_log: true

- name: Report targeted server replacement completion
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key | upper }} old server and RHACM install state are gone.
      Run `make deploy` to provision and install the selected {{ replace_site_server_type }} replacement.
  when: replace_site_required | bool

- name: Report no replacement required
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} has no existing incompatible server to replace.
  when: not replace_site_required | bool
