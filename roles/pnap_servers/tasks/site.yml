---
# Each site can spend more than phoenixNAP's 15-minute OAuth token lifetime
# in Assisted Installer discovery/LACP waits. Refresh at the start of every
# site so SW1 work can never leave C1 using an expired bearer token.
- name: Refresh phoenixNAP OAuth token before {{ site_item.key }} server work
  ansible.builtin.include_role:
    name: pnap_auth
    tasks_from: refresh.yml

- name: Find existing server by hostname
  ansible.builtin.set_fact:
    existing_site_server: >-
      {{ (pnap_servers_existing.json
          | selectattr('hostname', 'equalto', site_item.value.node_hostname)
          | list | first) | default({}) }}

- name: Set desired server type for {{ site_item.key }}
  ansible.builtin.set_fact:
    site_server_type: >-
      {{ existing_site_server.type
         if (phoenixnap.auto_select.enabled | bool and existing_site_server | length > 0)
         else (pnap_selected_skus[site_item.key].productCode
               if phoenixnap.auto_select.enabled | bool
               else site_item.value.server_type | default(phoenixnap.server_type)) }}

- name: Read {{ site_item.key }} InfraEnv iPXE URL
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: InfraEnv
    name: "{{ site_item.value.cluster_name }}"
    namespace: "{{ site_item.value.cluster_name }}"
  register: site_infraenv

- name: Require iPXE script URL
  ansible.builtin.assert:
    that:
      - site_infraenv.resources | length == 1
      - site_infraenv.resources[0].status.bootArtifacts.ipxeScript | default('') | length > 0
      - site_infraenv.resources[0].status.bootArtifacts.ipxeScript | length <= 1000
    fail_msg: "InfraEnv iPXE URL is missing or exceeds the phoenixNAP 1000-character iPXE URL limit for {{ site_item.key }}."

- name: Read full existing server network configuration
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ existing_site_server.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: existing_site_server_detail
  when: existing_site_server | length > 0
  no_log: true

- name: Find site private Layer2 network
  ansible.builtin.set_fact:
    site_private_network: >-
      {{ (pnap_private_networks_for_servers.json
          | selectattr('name', 'equalto', site_item.value.private_l2.name)
          | selectattr('location', 'equalto', site_item.value.location)
          | list | first) | default({}) }}

- name: Require site private Layer2 network before provisioning
  ansible.builtin.assert:
    that:
      - site_private_network | length > 0
      - site_private_network.id | length > 0
      - site_private_network.vlanId is defined
    fail_msg: >-
      Private L2 network {{ site_item.value.private_l2.name }} is missing in
      {{ site_item.value.location }}. Run `make private-networks` first.

- name: Read private Layer2 network membership from Networks API
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks/{{ site_private_network.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: site_private_network_detail
  when: existing_site_server | length > 0
  no_log: true

- name: Determine existing private Layer2 network membership from both APIs
  ansible.builtin.set_fact:
    site_private_network_attached_from_server: >-
      {{ (existing_site_server_detail.json.networkConfiguration.privateNetworkConfiguration.privateNetworks | default([])
          | selectattr('id', 'equalto', site_private_network.id)
          | list | length) > 0 }}
    site_private_network_attached_from_network: >-
      {{ (site_private_network_detail.json.servers | default([])
          | selectattr('id', 'defined')
          | selectattr('id', 'equalto', existing_site_server.id)
          | list | length) > 0 }}
  when: existing_site_server | length > 0

- name: Publish effective existing private Layer2 network membership
  ansible.builtin.set_fact:
    site_private_network_attached: >-
      {{ (site_private_network_attached_from_server | default(false) | bool)
         or (site_private_network_attached_from_network | default(false) | bool) }}
  when: existing_site_server | length > 0

- name: Refuse to silently reuse an incompatible existing server shape or network mode
  ansible.builtin.assert:
    that:
      - existing_site_server.type == site_server_type
      - existing_site_server_detail.json.networkType | default('') == phoenixnap.network_type
    fail_msg: >-
      Existing {{ site_item.value.node_hostname }} is not compatible with the lab definition.
      Current type={{ existing_site_server.type | default('unknown') }}, desired={{ site_server_type }};
      current networkType={{ existing_site_server_detail.json.networkType | default('unknown') }},
      desired={{ phoenixnap.network_type }}. phoenixNAP cannot resize a server in place.
      Run `make replace-servers`, then rerun deployment.
  when:
    - existing_site_server | length > 0
    - phoenixnap.fail_on_existing_server_mismatch | bool

- name: Best-effort attach missing private Layer2 network to compatible existing server
  ansible.builtin.uri:
    url: >-
      {{ phoenixnap.api_base }}/bmc/v1/servers/{{ existing_site_server.id }}/network-configuration/private-network-configuration/private-networks?force=true
    method: POST
    headers:
      Authorization: "Bearer {{ pnap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      # phoenixNAP documents id + an explicit empty ips list for a NO-CIDR
      # private network when force=true. Avoid sending optional DHCP state on
      # a day-2 attach because an existing server can have provider-owned
      # private-network metadata that differs from the original provision call.
      id: "{{ site_private_network.id }}"
      ips: []
    return_content: true
    status_code: [200, 201, 202, 400, 409, 422]
  register: existing_server_private_network_attach
  when:
    - existing_site_server | length > 0
    - phoenixnap.reconcile_existing_private_networks | default(true) | bool
    - not (site_private_network_attached | default(false) | bool)
  no_log: true

- name: Publish sanitized existing-server private-network attach result
  ansible.builtin.set_fact:
    existing_server_private_network_attach_ok: >-
      {{ (existing_server_private_network_attach.status | default(0) | int) in [200, 201, 202] }}
    existing_server_private_network_attach_error: >-
      {{ (existing_server_private_network_attach.json | default({})).message
         | default('phoenixNAP rejected the day-2 private-network attachment') }}
      {{ (existing_server_private_network_attach.json | default({})).validationErrors
         | default([]) | to_json }}
  when:
    - existing_site_server | length > 0
    - phoenixnap.reconcile_existing_private_networks | default(true) | bool
    - not (site_private_network_attached | default(false) | bool)

- name: Wait for successful private Layer2 network attachment to appear in Networks API
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks/{{ site_private_network.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: existing_server_after_private_network_attach
  until: >-
    (existing_server_after_private_network_attach.json.servers | default([])
     | selectattr('id', 'defined')
     | selectattr('id', 'equalto', existing_site_server.id)
     | list | length) > 0
  retries: 24
  delay: 5
  when:
    - existing_site_server | length > 0
    - not (site_private_network_attached | default(false) | bool)
    - existing_server_private_network_attach_ok | default(false) | bool
  no_log: true

- name: Report successful in-place private Layer2 network reconciliation
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} existing server was retained and attached in place to
      {{ site_private_network.name }} (VLAN {{ site_private_network.vlanId }}).
      No server replacement was required.
  when:
    - existing_site_server | length > 0
    - not (site_private_network_attached | default(false) | bool)
    - existing_server_private_network_attach_ok | default(false) | bool

- name: Warn instead of blocking make deploy when day-2 private-network reconciliation is rejected
  ansible.builtin.debug:
    msg: >-
      WARNING: phoenixNAP did not accept the optional day-2 attachment of
      {{ site_private_network.name }} to existing {{ site_item.key }} server:
      {{ existing_server_private_network_attach_error | default('unknown API error') }}.
      The already-installed SNO is retained and make deploy will continue so the
      OpenShift Virtualization and EVPN platform configuration can be reconciled.
      This becomes fatal only when phoenixnap.fail_on_existing_private_network_reconcile_error=true.
  when:
    - existing_site_server | length > 0
    - phoenixnap.reconcile_existing_private_networks | default(true) | bool
    - not (site_private_network_attached | default(false) | bool)
    - not (existing_server_private_network_attach_ok | default(false) | bool)

- name: Optionally fail on rejected existing-server private-network reconciliation
  ansible.builtin.assert:
    that:
      - existing_server_private_network_attach_ok | default(false) | bool
    fail_msg: >-
      phoenixNAP rejected the day-2 private-network attachment for {{ site_item.key }}:
      {{ existing_server_private_network_attach_error | default('unknown API error') }}.
  when:
    - existing_site_server | length > 0
    - phoenixnap.reconcile_existing_private_networks | default(true) | bool
    - not (site_private_network_attached | default(false) | bool)
    - phoenixnap.fail_on_existing_private_network_reconcile_error | default(false) | bool

- name: Provision hourly {{ site_server_type }} with public management and private L2 VLAN
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers?force=true"
    method: POST
    headers:
      Authorization: "Bearer {{ pnap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      hostname: "{{ site_item.value.node_hostname }}"
      description: "OpenShift {{ ocp_minor }} SNO {{ site_item.key }} - {{ project_name }}"
      location: "{{ site_item.value.location }}"
      os: ipxe
      type: "{{ site_server_type }}"
      pricingModel: "{{ phoenixnap.pricing_model }}"
      networkType: "{{ phoenixnap.network_type }}"
      installDefaultSshKeys: "{{ phoenixnap.install_default_ssh_keys | bool }}"
      networkConfiguration:
        ipBlocksConfiguration:
          configurationType: PURCHASE_NEW
        privateNetworkConfiguration:
          configurationType: USER_DEFINED
          privateNetworks:
            # Pure L2 NO-CIDR network. The tagged VLAN is consumed on bond0
            # after the phoenixNAP dual-NIC LACP bond is established.
            - id: "{{ site_private_network.id }}"
              ips: []
              dhcp: false
      osConfiguration:
        iPXE:
          url: "{{ site_infraenv.resources[0].status.bootArtifacts.ipxeScript }}"
    return_content: true
    status_code: [200, 201, 202, 400, 409, 422]
  register: site_server_create
  when: existing_site_server | length == 0
  no_log: true

- name: Publish sanitized server-provisioning API error
  ansible.builtin.set_fact:
    site_server_create_error: >-
      {{ (site_server_create.json | default({})).message | default('phoenixNAP rejected the server provisioning request') }}
      {{ (site_server_create.json | default({})).validationErrors | default([]) | to_json }}
  when:
    - existing_site_server | length == 0
    - (site_server_create.status | int) not in [200, 201, 202]

- name: Require phoenixNAP server provisioning to succeed
  ansible.builtin.assert:
    that:
      - existing_site_server | length > 0 or (site_server_create.status | int) in [200, 201, 202]
    fail_msg: >-
      phoenixNAP could not provision {{ site_item.key }} {{ site_server_type }} in
      {{ site_item.value.location }}: {{ site_server_create_error | default('unknown API error') }}.
      If the error says `OS unsupported in location`, the SERVER SKU is valid but native
      `os: ipxe` is not offered there. Use one of
      {{ phoenixnap.ipxe_network.supported_locations | join(', ') }} for this workflow,
      or use a different bootstrap method. Otherwise run `make availability` and retry if
      one-unit stock was consumed between selection and provisioning. OAuth headers remain hidden.

- name: Determine server ID
  ansible.builtin.set_fact:
    site_server_id: >-
      {{ existing_site_server.id
         if existing_site_server | length > 0
         else site_server_create.json.id }}

- name: Wait for public IP and powered-on state
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ site_server_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: site_server_info
  until:
    - site_server_info.json.status in ['powered-on', 'powered-off']
    - site_server_info.json.publicIpAddresses | default([]) | length > 0
  retries: "{{ (wait.server_seconds / 15) | int }}"
  delay: 15
  no_log: true

- name: Read final private Layer2 network membership from Networks API
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/networks/v1/private-networks/{{ site_private_network.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ pnap_token }}"
    return_content: true
    status_code: 200
  register: final_site_private_network_detail
  no_log: true

- name: Determine final private Layer2 network membership
  ansible.builtin.set_fact:
    final_site_private_network_attached: >-
      {{ ((site_server_info.json.networkConfiguration.privateNetworkConfiguration.privateNetworks | default([])
           | selectattr('id', 'equalto', site_private_network.id)
           | list | length) > 0)
         or
         ((final_site_private_network_detail.json.servers | default([])
           | selectattr('id', 'defined')
           | selectattr('id', 'equalto', site_server_id)
           | list | length) > 0) }}

- name: Require requested private Layer2 network on newly provisioned servers
  ansible.builtin.assert:
    that:
      - final_site_private_network_attached | bool
    fail_msg: >-
      {{ site_item.key }} was newly provisioned but private L2 network
      {{ site_private_network.name }} is not attached.
  when: existing_site_server | length == 0

- name: Optionally require requested private Layer2 network on existing servers
  ansible.builtin.assert:
    that:
      - final_site_private_network_attached | bool
    fail_msg: >-
      Existing {{ site_item.key }} server is running but private L2 network
      {{ site_private_network.name }} could not be confirmed after reconciliation.
  when:
    - existing_site_server | length > 0
    - phoenixnap.fail_on_existing_private_network_reconcile_error | default(false) | bool

- name: Report non-blocking existing-server private Layer2 mismatch
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} is an already-installed server and membership in
      {{ site_private_network.name }} could not be confirmed by either phoenixNAP API.
      Continuing make deploy because this site-local Localnet VLAN is independent of
      the OpenShift EVPN platform enablement.
  when:
    - existing_site_server | length > 0
    - not (final_site_private_network_attached | bool)
    - not (phoenixnap.fail_on_existing_private_network_reconcile_error | default(false) | bool)

- name: Wait for RHACM Agent discovered by iPXE
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ site_item.value.cluster_name }}"
  register: discovered_agents
  failed_when: false
  until:
    - not (discovered_agents.failed | default(false) | bool)
    - (discovered_agents.resources | default([]) | length) >= 1
  retries: 120
  delay: 10

- name: Select newest discovered SNO Agent
  ansible.builtin.set_fact:
    discovered_agent_name: >-
      {{ ((discovered_agents.resources | default([]))
          | sort(attribute='metadata.creationTimestamp', reverse=true)
          | first).metadata.name }}

# The Agent object can appear before Assisted Installer has published the JSON
# inventory annotation.  Do not parse the stale object returned by the initial
# discovery poll: re-read the selected Agent until the complete inventory
# snapshot (including interfaces and routes) is present.
- name: Wait for complete Assisted Installer discovery inventory
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    name: "{{ discovered_agent_name }}"
    namespace: "{{ site_item.value.cluster_name }}"
  register: discovered_agent_inventory_state
  failed_when: false
  until: >-
    (not (discovered_agent_inventory_state.failed | default(false) | bool)) and
    ((discovered_agent_inventory_state.resources | default([]) | length) == 1) and
    (((discovered_agent_inventory_state.resources[0].metadata.annotations | default({}))
      ['agent.agent-install.openshift.io/inventory'] | default('') | trim | length) > 2) and
    ('"interfaces"' in ((discovered_agent_inventory_state.resources[0].metadata.annotations | default({}))
      ['agent.agent-install.openshift.io/inventory'] | default(''))) and
    ('"routes"' in ((discovered_agent_inventory_state.resources[0].metadata.annotations | default({}))
      ['agent.agent-install.openshift.io/inventory'] | default('')))
  retries: "{{ phoenixnap.ipxe_network.inventory_wait_retries | default(60) | int }}"
  delay: "{{ phoenixnap.ipxe_network.inventory_wait_seconds | default(5) | int }}"
  when: phoenixnap.ipxe_network.configure_lacp_bond | bool

- name: Refresh selected SNO Agent after inventory publication
  ansible.builtin.set_fact:
    discovered_agent: >-
      {{ discovered_agent_inventory_state.resources[0]
         if phoenixnap.ipxe_network.configure_lacp_bond | bool
         else ((discovered_agents.resources | default([]))
               | sort(attribute='metadata.creationTimestamp', reverse=true)
               | first) }}

- name: Parse phoenixNAP discovery inventory
  ansible.builtin.set_fact:
    pnap_agent_inventory: >-
      {{ ((discovered_agent.metadata.annotations | default({}))
          ['agent.agent-install.openshift.io/inventory'] | default('{}')) | from_json }}
  when: phoenixnap.ipxe_network.configure_lacp_bond | bool

- name: Require complete phoenixNAP discovery inventory before LACP bootstrap
  ansible.builtin.assert:
    that:
      - pnap_agent_inventory is mapping
      - pnap_agent_inventory.interfaces | default([]) | length >= 2
      - pnap_agent_inventory.routes | default([]) | length >= 1
    fail_msg: >-
      {{ site_item.key }} Agent {{ discovered_agent_name }} was discovered, but its
      Assisted Installer inventory is incomplete after the inventory wait.
      Refusing to build LACP from partial NIC/route data. Re-run `make deploy`;
      if this repeats, inspect `oc get agent -n {{ site_item.value.cluster_name }}
      {{ discovered_agent_name }} -o yaml`.
  when: phoenixnap.ipxe_network.configure_lacp_bond | bool

- name: Find physical data NICs and current default routes
  ansible.builtin.set_fact:
    pnap_data_nics: >-
      {{ pnap_agent_inventory.interfaces
         | selectattr('type', 'equalto', 'physical')
         | selectattr('biosdevname', 'defined')
         | list }}
    pnap_default_routes: >-
      {{ pnap_agent_inventory.routes | default([])
         | selectattr('destination', 'equalto', '0.0.0.0')
         | sort(attribute='metric')
         | list }}
    pnap_bond_already_present: >-
      {{ (pnap_agent_inventory.interfaces
          | selectattr('name', 'equalto', phoenixnap.ipxe_network.bond_name)
          | list | length) > 0 }}
  when: phoenixnap.ipxe_network.configure_lacp_bond | bool

- name: Require dual NIC inventory before LACP bootstrap
  ansible.builtin.assert:
    that:
      - pnap_data_nics | length == 2
      - pnap_default_routes | length >= 1
    fail_msg: >-
      {{ site_item.key }} did not expose exactly two phoenixNAP data NICs plus a default route.
      NICs={{ pnap_data_nics | map(attribute='name') | list }}, routes={{ pnap_default_routes }}.
      Refusing to change discovery networking automatically.
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Select primary and secondary phoenixNAP NICs
  ansible.builtin.set_fact:
    pnap_primary_nic_name: "{{ pnap_default_routes[0].interface }}"
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Resolve primary and secondary NIC objects
  ansible.builtin.set_fact:
    pnap_primary_nic: >-
      {{ pnap_data_nics | selectattr('name', 'equalto', pnap_primary_nic_name) | list | first }}
    pnap_secondary_nic: >-
      {{ pnap_data_nics | rejectattr('name', 'equalto', pnap_primary_nic_name) | list | first }}
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Require a deterministic primary/secondary NIC pair
  ansible.builtin.assert:
    that:
      - pnap_primary_nic | length > 0
      - pnap_secondary_nic | length > 0
      - pnap_primary_nic.mac_address | default('') | length > 0
      - pnap_secondary_nic.mac_address | default('') | length > 0
    fail_msg: >-
      Could not map the preferred default-route interface {{ pnap_primary_nic_name }}
      to the two phoenixNAP physical NICs for {{ site_item.key }}. Refusing to create a bond.
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Remember current InfraEnv identity and spec before deterministic LACP rebuild
  ansible.builtin.set_fact:
    pnap_old_infraenv_uid: "{{ site_infraenv.resources[0].metadata.uid }}"
    pnap_infraenv_spec_for_recreate: "{{ site_infraenv.resources[0].spec }}"
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Create discovery NMStateConfig for phoenixNAP dual-NIC LACP
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: NMStateConfig
      metadata:
        name: "{{ site_item.value.cluster_name }}-pnap-bond"
        namespace: "{{ site_item.value.cluster_name }}"
        labels:
          digitaldovey.net/pnap-bond: "{{ site_item.key }}"
      spec:
        config:
          interfaces:
            - name: "{{ pnap_primary_nic.name }}"
              type: ethernet
              state: up
              ipv4:
                enabled: false
              ipv6:
                enabled: false
            - name: "{{ pnap_secondary_nic.name }}"
              type: ethernet
              state: up
              ipv4:
                enabled: false
              ipv6:
                enabled: false
            - name: "{{ phoenixnap.ipxe_network.bond_name }}"
              type: bond
              state: up
              # Use the preferred DHCP NIC's real MAC explicitly. This is the
              # exact shape validated manually on phoenixNAP and keeps the
              # public DHCP lease stable when the two physical ports join LACP.
              mac-address: "{{ pnap_primary_nic.mac_address | upper }}"
              mtu: "{{ phoenixnap.ipxe_network.mtu | int }}"
              ipv4:
                enabled: true
                dhcp: true
              ipv6:
                enabled: false
              link-aggregation:
                mode: "{{ phoenixnap.ipxe_network.bond_mode }}"
                options:
                  miimon: "{{ phoenixnap.ipxe_network.miimon | string }}"
                  lacp_rate: "{{ phoenixnap.ipxe_network.lacp_rate }}"
                  xmit_hash_policy: "{{ phoenixnap.ipxe_network.xmit_hash_policy }}"
                  updelay: "{{ phoenixnap.ipxe_network.updelay | string }}"
                  downdelay: "{{ phoenixnap.ipxe_network.downdelay | string }}"
                port:
                  - "{{ pnap_primary_nic.name }}"
                  - "{{ pnap_secondary_nic.name }}"
        interfaces:
          - name: "{{ pnap_primary_nic.name }}"
            macAddress: "{{ pnap_primary_nic.mac_address }}"
          - name: "{{ pnap_secondary_nic.name }}"
            macAddress: "{{ pnap_secondary_nic.mac_address }}"
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Delete bootstrap InfraEnv so NMState is present from image creation
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: absent
    api_version: agent-install.openshift.io/v1beta1
    kind: InfraEnv
    name: "{{ site_item.value.cluster_name }}"
    namespace: "{{ site_item.value.cluster_name }}"
    wait: true
    wait_timeout: 180
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Recreate InfraEnv with LACP NMState selector present from creation
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: InfraEnv
      metadata:
        name: "{{ site_item.value.cluster_name }}"
        namespace: "{{ site_item.value.cluster_name }}"
        annotations:
          digitaldovey.net/pnap-network-bootstrap: "lacp-v1"
      spec: >-
        {{ pnap_infraenv_spec_for_recreate
           | combine({
               'nmStateConfigLabelSelector': {
                 'matchLabels': {
                   'digitaldovey.net/pnap-bond': site_item.key
                 }
               },
               'additionalNTPSources': rhacm.additional_ntp_sources
             }, recursive=True) }}
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Wait for a new InfraEnv image with LACP network state
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: InfraEnv
    name: "{{ site_item.value.cluster_name }}"
    namespace: "{{ site_item.value.cluster_name }}"
  register: bonded_infraenv
  failed_when: false
  until: >-
    (not (bonded_infraenv.failed | default(false) | bool)) and
    ((bonded_infraenv.resources | default([]) | length) == 1) and
    (bonded_infraenv.resources[0].metadata.uid | default('') != pnap_old_infraenv_uid) and
    (bonded_infraenv.resources[0].status.bootArtifacts.ipxeScript | default('') | length > 0) and
    ((bonded_infraenv.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'ImageCreated')
      | selectattr('status', 'equalto', 'True')
      | list | length) >= 1)
  retries: 60
  delay: 10
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Report deterministic LACP discovery image replacement
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }} InfraEnv recreated for LACP discovery:
      oldUID={{ pnap_old_infraenv_uid }},
      newUID={{ bonded_infraenv.resources[0].metadata.uid }},
      createdTime={{ bonded_infraenv.resources[0].status.createdTime | default('not-published') }}.
      The new iPXE URL will be pushed to phoenixNAP before reboot.
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

# The discovery/image rebuild above can itself consume most of a token TTL.
# Refresh immediately before returning to the BMC API for the reboot.
- name: Refresh phoenixNAP OAuth token before {{ site_item.key }} LACP reboot
  ansible.builtin.include_role:
    name: pnap_auth
    tasks_from: refresh.yml
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Reboot phoenixNAP server into deterministic LACP discovery image
  ansible.builtin.uri:
    url: "{{ phoenixnap.api_base }}/bmc/v1/servers/{{ site_server_id }}/actions/reboot"
    method: POST
    headers:
      Authorization: "Bearer {{ pnap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      bootType: IPXE
      ipxeUrl: "{{ bonded_infraenv.resources[0].status.bootArtifacts.ipxeScript }}"
    return_content: true
    status_code: 200
  register: pnap_bond_reboot
  no_log: true
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Wait for Agent to return with bond and passing network validations
  kubernetes.core.k8s_info:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ site_item.value.cluster_name }}"
  register: post_bond_agents
  failed_when: false
  until: >-
    (not (post_bond_agents.failed | default(false) | bool)) and
    (((post_bond_agents.resources | default([]))
      | map(attribute='status.inventory.interfaces', default=[])
      | flatten
      | selectattr('name', 'equalto', phoenixnap.ipxe_network.bond_name)
      | list | length) >= 1) and
    (((post_bond_agents.resources | default([]))
      | map(attribute='status.validationsInfo.network', default=[])
      | flatten
      | selectattr('id', 'equalto', 'non-overlapping-subnets')
      | selectattr('status', 'equalto', 'success')
      | list | length) >= 1) and
    (((post_bond_agents.resources | default([]))
      | map(attribute='status.validationsInfo.network', default=[])
      | flatten
      | selectattr('id', 'equalto', 'ntp-synced')
      | selectattr('status', 'equalto', 'success')
      | list | length) >= 1)
  retries: 120
  delay: 10
  ignore_errors: true
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Build sanitized post-bond discovery diagnostics
  ansible.builtin.set_fact:
    pnap_post_bond_interfaces: >-
      {{ post_bond_agents.resources
         | default([])
         | map(attribute='status.inventory.interfaces', default=[])
         | flatten
         | map(attribute='name')
         | list }}
    pnap_post_bond_network_validations: >-
      {{ post_bond_agents.resources
         | default([])
         | map(attribute='status.validationsInfo.network', default=[])
         | flatten
         | selectattr('id', 'in', ['non-overlapping-subnets', 'ntp-synced'])
         | list }}
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Require Agent to return with LACP bond and healthy discovery networking
  ansible.builtin.assert:
    that:
      - >-
        (post_bond_agents.resources | default([])
         | map(attribute='status.inventory.interfaces', default=[])
         | flatten
         | selectattr('name', 'equalto', phoenixnap.ipxe_network.bond_name)
         | list | length) >= 1
      - >-
        (post_bond_agents.resources | default([])
         | map(attribute='status.validationsInfo.network', default=[])
         | flatten
         | selectattr('id', 'equalto', 'non-overlapping-subnets')
         | selectattr('status', 'equalto', 'success')
         | list | length) >= 1
      - >-
        (post_bond_agents.resources | default([])
         | map(attribute='status.validationsInfo.network', default=[])
         | flatten
         | selectattr('id', 'equalto', 'ntp-synced')
         | selectattr('status', 'equalto', 'success')
         | list | length) >= 1
    fail_msg: >-
      {{ site_item.key }} rediscovered but did not reach the expected LACP/NTP state.
      interfaces={{ pnap_post_bond_interfaces | default([]) }};
      validations={{ pnap_post_bond_network_validations | default([]) }}.
      Inspect `oc get nmstateconfig -n {{ site_item.value.cluster_name }} -o yaml`
      and the phoenixNAP console before rebooting again.
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Default to initially discovered Agent state for approval
  ansible.builtin.set_fact:
    agents_ready_for_approval: "{{ discovered_agents.resources | default([]) }}"

- name: Use post-bond Agent state for approval
  ansible.builtin.set_fact:
    agents_ready_for_approval: "{{ post_bond_agents.resources | default([]) }}"
  when:
    - phoenixnap.ipxe_network.configure_lacp_bond | bool
    - not (pnap_bond_already_present | bool)

- name: Approve discovered Agent and assign SNO master role
  kubernetes.core.k8s:
    kubeconfig: "{{ rhacm.kubeconfig }}"
    state: patched
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    name: "{{ item.metadata.name }}"
    namespace: "{{ site_item.value.cluster_name }}"
    definition:
      spec:
        approved: true
        role: master
  loop: "{{ agents_ready_for_approval }}"

- name: Create local artifact directory
  ansible.builtin.file:
    path: artifacts/servers
    state: directory
    mode: '0700'

- name: Save non-secret server state
  ansible.builtin.copy:
    dest: "artifacts/servers/{{ site_item.key }}.yml"
    mode: '0600'
    content: |
      server_id: {{ site_server_info.json.id }}
      hostname: {{ site_server_info.json.hostname }}
      location: {{ site_server_info.json.location }}
      type: {{ site_server_info.json.type }}
      public_ip: {{ site_server_info.json.publicIpAddresses[0] }}
      primary_network_bond: {{ phoenixnap.ipxe_network.bond_name }}
      private_l2_network_id: {{ site_private_network.id }}
      private_l2_vlan_id: {{ site_private_network.vlanId }}
      private_l2_host_ip: none
      private_l2_guest_cidr: {{ site_item.value.private_l2.cidr }}
      status: {{ site_server_info.json.status }}

- name: Report server endpoint
  ansible.builtin.debug:
    msg: >-
      {{ site_item.key }}: {{ site_server_info.json.hostname }} ->
      public={{ site_server_info.json.publicIpAddresses[0] }},
      primary={{ phoenixnap.ipxe_network.bond_name }} (dual-NIC LACP),
      private-L2=NO-CIDR/VLAN{{ site_private_network.vlanId }},
      guest-CIDR={{ site_item.value.private_l2.cidr }}
      ({{ site_server_info.json.status }})
